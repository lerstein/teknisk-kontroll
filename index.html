<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RC Portal">
<title>RC Portal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#111316;--kort:#1b1e23;--kort2:#252930;--linje:#323741;--tekst:#eceef1;--dempet:#98a1ac;
  --aksent:#ffa326;--klubb:#a6192e;--aksent-t:#1a1300;--s0:#2e9e4f;--s1:#d6a915;--s2:#d43a3a;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tekst);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.uten-nav{padding-bottom:0}
header.topp{position:sticky;top:0;z-index:5;background:rgba(17,19,22,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:3px solid var(--klubb);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.topp h1{font-size:17px;margin:0;font-weight:700}
.topp .hvem{margin-left:auto;font-size:12.5px;color:var(--dempet);text-align:right;line-height:1.25}
button.hvem{background:none;border:0;padding:4px 0 4px 8px;min-height:0;font:inherit;font-size:12.5px;display:flex;align-items:center;gap:8px;color:var(--dempet);font-weight:400}
button.hvem svg{width:26px;height:26px;flex:none;color:var(--tekst)}
button.hvem.aktiv svg{color:var(--aksent)}
/* handbook */
.hbgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.hbkort{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;background:var(--kort);border:1px solid var(--linje);border-radius:var(--r);min-height:0;font:inherit;color:var(--tekst);align-items:stretch}
.hbkort .hbbilde{aspect-ratio:3/2;background:#0c0e11 center/cover no-repeat;display:grid;place-items:center;color:#4b525c}
.hbkort .hbbilde svg{width:34px;height:34px}
.hbkort .hbtekst{padding:8px 10px 10px;font-weight:700;font-size:14.5px;line-height:1.2}
.hbkort .merke{margin-top:5px;font-size:10px}
.hbstor{width:100%;border-radius:10px;display:block;margin-bottom:12px;background:#0c0e11}
.hbseksjon h4{color:var(--aksent);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.hbseksjon p{margin:0 0 8px;line-height:1.5}
.hbseksjon ul,.hbseksjon ol{margin:4px 0 10px;padding-left:22px;line-height:1.5}
.hbseksjon li{margin-bottom:5px}
.hbmangler{text-align:center;color:var(--dempet);padding:26px 14px;aspect-ratio:3/2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.hbmangler svg{width:44px;height:44px}
.hbbildetekst{font-size:13px;color:var(--dempet);text-align:center;margin:-6px 0 12px;font-style:italic}
.topp .tilbake{min-height:36px;padding:6px 12px;font-size:15px}
main{max-width:760px;margin:0 auto;padding:16px}
nav.bunn{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#16191d;border-top:1px solid var(--linje);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bunn button{flex:1;background:none;border:0;border-radius:0;color:var(--dempet);padding:9px 2px 8px;font:600 11.5px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
nav.bunn svg{width:23px;height:23px}
nav.bunn button.aktiv{color:var(--aksent)}
h2{font-size:21px;margin:2px 0 14px;line-height:1.2}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dempet);margin:22px 0 8px;font-weight:700}
.kort h3:first-child{margin-top:0}
p{margin:0 0 10px}
.dempet{color:var(--dempet);font-size:14px}
.tom{color:var(--dempet);font-style:italic}
.kort{display:block;width:100%;text-align:left;background:var(--kort);border:1px solid var(--linje);border-radius:var(--r);padding:14px;margin:0 0 10px;color:var(--tekst);font:inherit}
button.kort{cursor:pointer}
button.kort:active{background:var(--kort2)}
button,.knapp{font:600 15px system-ui;border-radius:10px;border:1px solid var(--linje);background:var(--kort2);color:var(--tekst);padding:11px 14px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:disabled{opacity:.55;cursor:default}
.primar{background:var(--aksent);color:var(--aksent-t);border-color:var(--aksent)}
.fare{background:transparent;color:#ff8d8d;border-color:#6b2e2e}
.bred{width:100%;margin-bottom:10px}
.knapperad{display:flex;gap:8px;flex-wrap:wrap}
.knapperad>*{flex:1}
input,select,textarea{width:100%;font:16px system-ui;color:var(--tekst);background:#0c0e11;border:1px solid var(--linje);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--aksent);outline-offset:-1px}
input[readonly]{opacity:.7}
label.felt{display:block;margin-bottom:12px}
label.felt>span,.felt-tittel{display:block;font-size:13px;color:var(--dempet);margin-bottom:5px}
.rad2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sjekk{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:600}
.sjekk input{width:24px;height:24px;min-height:0;accent-color:var(--aksent)}
.linje1{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* scale */
.punkt{padding:12px 0;border-top:1px solid var(--linje)}
.punkt:first-of-type{border-top:0;padding-top:4px}
.punkt .pnavn{font-weight:650;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.punkt.mangler .pnavn::after{content:attr(data-mangler);color:#ff9b54;font-size:12px;font-weight:700}
.skala{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.skala button{padding:8px 2px;font-size:14px;min-height:48px;line-height:1.1}
.skala button.valgt[data-v="0"]{background:var(--s0);border-color:var(--s0);color:#fff}
.skala button.valgt[data-v="1"]{background:var(--s1);border-color:var(--s1);color:#1a1400}
.skala button.valgt[data-v="2"]{background:var(--s2);border-color:var(--s2);color:#fff}
.ekstra{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ekstra input{min-height:42px;padding:9px 10px;font-size:15px}
.valg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.valg2 button{min-height:42px;padding:8px}
.valg2 button.valgt{background:var(--s0);border-color:var(--s0);color:#fff}
.valg2 button.valgt.neg{background:var(--s2);border-color:var(--s2)}
.valg2.noy button.valgt{background:#3c4452;border-color:#566070}
.oljerad{display:grid;grid-template-columns:1fr 1.1fr 1.6fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--linje)}
.oljerad:first-of-type{border-top:0}
.oljerad input{min-height:42px;padding:8px 10px;font-size:15px}
.oljerad b{font-weight:650;font-size:15px}
.banner{border-radius:10px;padding:12px 14px;font-weight:650;margin-bottom:12px;background:var(--kort2)}
.banner.v0{background:rgba(46,158,79,.16);color:#7fe39c;border:1px solid rgba(46,158,79,.4)}
.banner.v1{background:rgba(214,169,21,.14);color:#f1d062;border:1px solid rgba(214,169,21,.4)}
.banner.v2{background:rgba(212,58,58,.18);color:#ff9a9a;border:1px solid rgba(212,58,58,.55)}
.banner.info{background:rgba(70,120,200,.14);color:#a9c6f5;border:1px solid rgba(70,120,200,.4);font-weight:550}
/* chips & badges */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--kort2);color:var(--dempet);white-space:nowrap}
.chip.v0{background:rgba(46,158,79,.2);color:#7fe39c}
.chip.v1{background:rgba(214,169,21,.2);color:#f1d062}
.chip.v2{background:rgba(212,58,58,.28);color:#ffa3a3}
.merke{display:inline-block;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--s2);color:#fff;letter-spacing:.05em;white-space:nowrap}
.merke.gul{background:var(--s1);color:#1a1400}
.merke.gra{background:#3a414c;color:#d5dae0}
.merke.bla{background:#2d5b9a;color:#fff}
.status{font-size:13.5px;color:var(--dempet);margin-top:8px}
.rodt{color:#ff8d8d;font-weight:650}
.oransje{color:#ffab6b;font-weight:650}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat button{flex-direction:column;gap:0;padding:10px 4px;min-height:66px;background:var(--kort);font-weight:600}
.stat b{font-size:22px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--dempet)}
.stat button.aktiv{border-color:var(--aksent);box-shadow:inset 0 0 0 1px var(--aksent)}
.forklaring{font-size:12.5px;color:var(--dempet);margin:-4px 0 14px;display:flex;gap:10px;flex-wrap:wrap}
.forklaring i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dl.info dt{color:var(--dempet);font-size:14px}
dl.info dd{margin:0;font-weight:600;text-align:right}
.kodeboks{background:#0c0e11;border:1px dashed var(--aksent);border-radius:12px;padding:14px;text-align:center;margin:10px 0}
.kodeboks b{font-size:32px;letter-spacing:.18em;color:var(--aksent);display:block;font-variant-numeric:tabular-nums}
/* login */
.login{max-width:420px;padding-top:calc(48px + env(safe-area-inset-top))}
.ordmerke{height:46px;width:auto;display:block;margin:0 auto}
.ordmerke-topp{height:24px;width:auto;display:block}
.logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
div.logo{width:64px;height:64px;border-radius:16px;background:var(--aksent);color:var(--aksent-t);display:grid;place-items:center}
.logo svg{width:40px;height:40px}
.login h1{text-align:center;font-size:24px;margin:0 0 4px}
.login .under{text-align:center;color:var(--dempet);margin-bottom:22px}
.faner2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.faner2 button.aktiv{border-color:var(--aksent);color:var(--aksent)}
.hint{text-align:center;color:var(--dempet);font-size:14px;margin-top:12px}
/* overlay & toast */
#lag{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#lag main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;transition:opacity .2s,transform .2s;
  background:#f1f2f4;color:#111;padding:11px 16px;border-radius:10px;font-weight:650;z-index:40;max-width:calc(100vw - 32px);pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast.vis{opacity:1;transform:translate(-50%,0)}
#toast.feil{background:var(--s2);color:#fff}
.laster{display:grid;place-items:center;min-height:60vh;color:var(--dempet)}
.spinn{width:28px;height:28px;border:3px solid var(--linje);border-top-color:var(--aksent);border-radius:50%;animation:spinn .8s linear infinite;margin:0 auto 10px}
@keyframes spinn{to{transform:rotate(360deg)}}
/* photos */
.bildeknapper{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bildeknapper .knapp{flex:1 1 0;flex-direction:column;gap:4px;font-size:13.5px;padding:9px 4px;min-width:0;min-height:62px;text-align:center;line-height:1.15}
.bildeknapper svg{width:22px;height:22px;flex:none}
.bilderad{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.tommel{position:relative;padding:0;border-radius:10px;overflow:hidden;border:1px solid var(--linje);background:#0c0e11;aspect-ratio:1/1;display:block;min-height:0;width:100%}
.tommel img{width:100%;height:100%;object-fit:cover;display:block}
.tommel span{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:700;padding:3px 6px;background:rgba(0,0,0,.66);color:#fff;text-align:left}
.tommel .fjern{position:absolute;top:4px;right:4px;width:30px;height:30px;min-height:0;padding:0;border-radius:50%;background:rgba(0,0,0,.72);border:0;color:#fff;font-size:19px;line-height:1}
img.stor{width:100%;border-radius:10px;display:block;background:#0c0e11;min-height:220px}
/* profile & bike photos */
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#0c0e11 center/cover;flex:none;border:2px solid var(--aksent);display:grid;place-items:center;color:#4b525c;overflow:hidden}
.avatar svg{width:38px;height:38px}
.avatar-liten{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid var(--aksent)}
.profiltopp{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.profiltopp .navn{font-weight:700;font-size:17px}
.mcmini{width:44px;height:30px;border-radius:6px;object-fit:cover;margin-right:8px;vertical-align:middle;flex:none}
.mcbilde{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:#0c0e11;margin-bottom:10px}
.lenkeknapp.fil{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.lenkeknapp.fil svg{width:18px;height:18px}
/* install */
.install{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;border-color:var(--aksent);background:linear-gradient(135deg,rgba(255,163,38,.13),var(--kort) 60%)}
.install p{margin:0;font-weight:600}
.install .knapperad button{min-height:40px}
ol.steg{padding-left:22px;margin:0 0 12px;line-height:1.5}
ol.steg li{margin-bottom:10px}
ol.steg svg{width:20px;height:20px;vertical-align:-4px;color:var(--aksent)}
/* follow-up, stats, feedback */
.bunnlenke{text-align:center;margin:26px 0 6px;font-size:14px}
.bunnlenke a{color:var(--dempet)}
.ofrad{display:flex;align-items:center;gap:10px}
.ofrad .ofinfo{flex:1;min-width:0}
.ofrad .knapp{min-height:38px;padding:6px 14px;flex:none}
.knapp.sendt{border-color:var(--s0);color:#7fe39c}
.sesong.pst span{font-size:11px;font-weight:700}
.statavd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
details.kort summary{cursor:pointer;font-weight:650;list-style:none}
details.kort summary::-webkit-details-marker{display:none}
details.kort summary::after{content:'▾';float:right;color:var(--dempet)}
details.kort[open] summary{margin-bottom:10px}
details.kort p{font-size:14.5px;color:#cfd3d9}
/* wolfpack */
.wpmerke{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.wpmerke.red{background:#a6192e;color:#fff}.wpmerke.black{background:#000;color:#fff;box-shadow:inset 0 0 0 1px #555}
.wpmerke.gold{background:#ffa326;color:#1a1300}.wpmerke.platina{background:linear-gradient(135deg,#f4f6f8,#b9c0c8);color:#1b1e23}
.wpnivaa{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.wpnivaa span{font-size:12px}
.wp{display:flex;flex-direction:column;gap:8px}
.wprad{display:flex;gap:10px;align-items:center;background:var(--kort);border:1px solid var(--linje);border-radius:var(--r);padding:10px 12px}
.wprad.forst{border-color:var(--aksent);box-shadow:inset 0 0 0 1px var(--aksent)}
.wpnr{width:30px;flex:none;text-align:center;font-weight:800;font-size:18px;color:var(--dempet);font-variant-numeric:tabular-nums}
.wpinfo{flex:1;min-width:0}
.wpkm{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.wpbar{height:12px;border-radius:6px;background:#0c0e11;margin:6px 0 4px;overflow:hidden}
.wpbar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#c4730f,var(--aksent))}
.wprad.forst .wpbar span{background:linear-gradient(90deg,var(--aksent),#ffc46e)}
/* season strip */
.sesong{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.sesong span{display:flex;align-items:center;justify-content:center;height:28px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.01em;background:#20242a;color:#6d7682;border:1px solid transparent}
.sesong span.v0{background:var(--s0);color:#fff}
.sesong span.v1{background:var(--s1);color:#1a1400}
.sesong span.v2{background:var(--s2);color:#fff}
.sesong span.mangler{border:1px dashed #b4652e;color:#ffab6b;background:transparent}
.sesong span.na{box-shadow:0 0 0 2px var(--aksent)}
.sesong span.fremtid{opacity:.4}
.skjemavalg{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.lenkeknapp{background:none;border:0;color:var(--aksent);padding:4px 0;min-height:0;font-weight:600;font-size:14px;text-decoration:underline}
.sprak{display:flex;gap:6px;justify-content:center;margin-top:18px}
.sprak button{min-height:36px;padding:6px 14px;font-size:14px}
.sprak button.aktiv{border-color:var(--aksent);color:var(--aksent)}
@media (min-width:600px){.stat span{font-size:12.5px}}
@media print{nav.bunn,header.topp,#toast{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"><div class="laster"><div><div class="spinn"></div>…</div></div></div>
<div id="lag" hidden></div>
<div id="toast"></div>
<script>

// ─── Settings ───────────────────────────────────────────────
const API_URL = 'https://script.google.com/macros/s/AKfycbzQ6G2EWbndE-2-MohZIaGeNGO9WOss2pFeHcVEWSDVo2wjYhzyHXOIucbHBjZ6qXbhUQ/exec';   // Apps Script web app URL (…/exec)

async function api(action, data) {
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token, lang: LANG }, data || {})) });
  } catch (e) { throw new Error(t('ingenKontakt')); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error(t('uventet', res.status)); }
  if (!j.ok) {
    if (j.kode === 'AUTH' && action !== 'login' && action !== 'aktiver') loggUt(j.feil);
    if (j.kode === 'BYTT') visTvungen();
    const e = new Error(j.feil || t('ukjentFeil')); e.kode = j.kode; throw e;
  }
  return j.data;
}

const BILDECACHE = {};
const bilderFor = (refType, refId) => (S.d.bilder || []).filter(b => b.ref_type === refType && String(b.ref_id) === String(refId));
const alderTimer = ts => (Date.now() - new Date(String(ts).replace(' ', 'T')).getTime()) / 3600e3;
const antBilder = (ty, id) => { const n = bilderFor(ty, id).length; return n ? (n === 1 ? t('bilde1') : t('bilderN', n)) : ''; };

/** Scale down on the phone before upload: max 1600 px, JPEG 80 %, typically 200–400 kB. */
function lesBilde(fil, maks = 1600) {
  return new Promise((ok, avvis) => {
    const url = URL.createObjectURL(fil);
    const img = new Image();
    img.onload = () => {
      const f = Math.min(1, maks / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); avvis(new Error(t('kunneIkkeLese', fil.name))); };
    img.src = url;
  });
}

function bildeKnapper(typer, attr) {
  return `<div class="bildeknapper">${typer.map(ty => `<label class="knapp">${svg(IKON.kamera)}<span>${t('bk_' + ty)}</span>
    <input type="file" accept="image/*" ${ty === 'annet' ? 'multiple' : ''} data-bilde="${ty}" ${attr || ''} hidden></label>`).join('')}</div>`;
}
function ventendeBilder(liste) {
  if (!liste || !liste.length) return '';
  return `<div class="bilderad">${liste.map((b, i) => `<div class="tommel"><img src="${b.data}" alt="${esc(t('bt_' + b.type))}"><span>${esc(t('bt_' + b.type))}</span>
    <button type="button" class="fjern" data-fjern-bilde="${i}" aria-label="${esc(t('fjernBilde'))}">×</button></div>`).join('')}</div>`;
}
function bildeGalleri(refType, refId) {
  const liste = bilderFor(refType, refId);
  if (!liste.length) return '';
  return `<div class="bilderad">${liste.map(b => `<button type="button" class="tommel" data-vis-bilde="${esc(b.id)}">
    <img data-bilde-id="${esc(b.id)}" alt="${esc(t('bt_' + b.type))}"><span>${esc(t('bt_' + b.type))}</span></button>`).join('')}</div>`;
}
function fyllBilder(rot) {
  $$('img[data-bilde-id]', rot).forEach(async img => {
    const id = img.dataset.bildeId;
    try {
      if (!BILDECACHE[id]) BILDECACHE[id] = api('hentBilde', { id }).then(r => r.data);
      const src = await BILDECACHE[id];
      if (img.isConnected) img.src = src;
    } catch (e) { delete BILDECACHE[id]; img.alt = t('kunneIkkeLaste'); }
  });
}
function kanLeggeTilBilde(refType, ref) {
  if (rolle() === 'admin') return true;
  const tilgang = (erRcLik() && ref.avdeling === meg().avdeling) || (refType === 'egen' && ref.telefon === meg().telefon);
  return tilgang && alderTimer(ref.tidspunkt) < S.d.innstillinger.bildeDager * 24;
}
const kanSletteBilde = b => rolle() === 'admin' || (['profil', 'sykkel'].includes(b.type) && (b.telefon === meg().telefon || (erRcLik() && b.avdeling === meg().avdeling))) ||
  (b.lastet_opp_av_tlf === meg().telefon && alderTimer(b.tidspunkt) < S.d.innstillinger.bildeDager * 24);
const sisteBilde = (refType, refId) => bilderFor(refType, refId).slice(-1)[0];
const kanProfilbilde = u => rolle() === 'admin' || u.telefon === meg().telefon || (erRcLik() && u.avdeling === meg().avdeling);
const kanSykkelbilde = s => rolle() === 'admin' || s.telefon === meg().telefon || (erRcLik() && s.avdeling === meg().avdeling);
const filKnapp = (type, ref, tekst) => `<label class="lenkeknapp fil">${svg(IKON.kamera)}<span>${tekst}</span>
  <input type="file" accept="image/*" data-bilde="${type}" data-direkte="${type}:${esc(ref)}" hidden></label>`;
function avatar(tlf, klasse) {
  const b = sisteBilde('profil', tlf);
  return b ? `<img class="${klasse || 'avatar'}" data-bilde-id="${esc(b.id)}" alt="">` : (klasse ? '' : `<div class="avatar">${svg(IKON.person)}</div>`);
}
function bildeKort(refType, ref, typer) {
  const galleri = bildeGalleri(refType, ref.id);
  const kan = kanLeggeTilBilde(refType, ref);
  if (!galleri && !kan) return '';
  return `<div class="kort"><h3>${t('bilderTittel')}</h3>${galleri || `<p class="tom" style="margin:0">${t('ingenBilder')}</p>`}
    ${kan ? bildeKnapper(typer, `data-direkte="${refType}:${esc(ref.id)}"`) : ''}</div>`;
}
async function lastOppBilder(liste, refType, refId, btn) {
  let feil = 0, melding = '';
  for (let i = 0; i < liste.length; i++) {
    if (btn) btn.innerHTML = t('lasterOppAv', i + 1, liste.length);
    try { await api('lastOppBilde', { ref_type: refType, ref_id: refId, type: liste[i].type, data: liste[i].data }); }
    catch (e) { feil++; melding = e.message; }
  }
  return feil ? t('bildeFeil', feil, liste.length, melding) : '';
}
async function velgBilder(el) {
  const filer = Array.from(el.files || []);
  el.value = '';
  if (!filer.length) return;
  const type = el.dataset.bilde;
  let data;
  const maks = type === 'profil' ? 500 : type === 'sykkel' ? 1400 : 1600;
  try { data = await Promise.all(filer.map(f => lesBilde(f, maks))); } catch (e) { return toast(e.message, true); }
  const nye = data.map(d => ({ type, data: d }));
  if (el.dataset.direkte) {
    const [refType, refId] = el.dataset.direkte.split(':');
    toast(nye.length > 1 ? t('lasterOppFlere', nye.length) : t('lasterOpp1'));
    const feil = await lastOppBilder(nye, refType, refId);
    try { await lastData(); } catch (e) { /* toast below */ }
    render(); if (LAG.length) LAG[LAG.length - 1]();
    return toast(feil || t('bildeLagret'), !!feil);
  }
  const sk = skjemaFor(el);
  if (!sk || !sk.obj) return;
  sk.obj.bilder = (sk.obj.bilder || []).concat(nye);
  if (sk.navn === 'K') { if (type === 'avis') F.bilde_avis = 'Ja'; lagreUtkast(); render(); }
  else visEgenSkjema();
}
function visBilde(id) {
  const b = (S.d.bilder || []).find(x => x.id === id);

  tegnLag(t('bt_' + b.type), `<img class="stor" data-bilde-id="${esc(b.id)}" alt="${esc(t('bt_' + b.type))}">
    <p class="dempet" style="margin-top:10px">${esc(t('lastetOppAv', b.lastet_opp_av, b.tidspunkt))}</p>

/** Odometer per year: first and last reading (inspections + self-declarations). 0 / empty = not read. */
function kmLogg(sykkelId) {
  const m = [...S.d.kontroller, ...S.d.egenerklaeringer]
    .filter(x => x.sykkel_id === sykkelId && Number(x.km) > 0)
    .map(x => ({ dato: String(x.dato).slice(0, 10), km: Number(x.km) }))
    .sort((a, b) => a.dato.localeCompare(b.dato));
  const aar = {};
  m.forEach(x => { const y = x.dato.slice(0, 4); (aar[y] = aar[y] || []).push(x); });
  return Object.keys(aar).sort().reverse().map(y => ({ aar: y, start: aar[y][0], slutt: aar[y][aar[y].length - 1], n: aar[y].length }));
}
const kmNr = v => Number(v).toLocaleString(LANG === 'en' ? 'en-GB' : 'nb-NO');
function kmLinjer(sykkelId) {
  const l = kmLogg(sykkelId);
  if (!l.length) return `<span class="tom">${t('kmIngen')}</span>`;
  return l.map(x => x.n > 1 && x.slutt.km >= x.start.km
    ? esc(t('kmAar', x.aar, kmNr(x.start.km), kmNr(x.slutt.km) + ' km', kmNr(x.slutt.km - x.start.km) + ' km'))
    : esc(t('kmEn', x.aar, kmNr(x.slutt.km) + ' km'))).join('<br>');
}

// ─── New inspection ─────────────────────────────────────────
// Fields that stay the same until something is changed: copied into a new inspection of the same bike.
const VIDEREFOR = ['dekk_f_dato', 'dekk_b_dato', 'olje_primaer', 'olje_primaer_ok', 'olje_clutch', 'olje_clutch_ok', 'olje_hydr', 'olje_hydr_ok',
                   'olje_motor', 'olje_motor_ok', 'kjolevaeske', 'kjolevaeske_ok', 'batteri_dato', 'batteri_ok'];
// Fields that change every time: shown as "last: …" hints only.
const HINT = ['dekk_f_mm', 'dekk_b_mm', 'brems_f_belegg', 'brems_b_belegg', 'km'];
const tom = v => v === undefined || v === null || v === '';
/** Most recent non-empty value per field across all earlier inspections of the bike. */
function forrigeVerdier(sykkelId) {
  const ut = {};
  kontrollerFor(sykkelId).forEach(k => [...VIDEREFOR, ...HINT].forEach(f => { if (tom(ut[f]) && !tom(k[f])) ut[f] = String(k[f]); }));
  return ut;
}
/** Fill carried-over fields that are still empty; remembers which ones so a bike change can undo them. */
function forhandsutfyll() {
  if (!F) return;
  (F._forhand || []).forEach(f => { if (F[f] === F._forhandVerdi[f]) delete F[f]; });
  F._forhand = []; F._forhandVerdi = {};
  if (!F.sykkel_id) return;
  const fv = forrigeVerdier(F.sykkel_id);
  VIDEREFOR.forEach(f => { if (tom(F[f]) && !tom(fv[f])) { F[f] = fv[f]; F._forhand.push(f); F._forhandVerdi[f] = fv[f]; } });
}

function standardMnd() {
  const nm = naaMnd();
  const m = nm < 4 ? 4 : nm > 10 ? 10 : nm;
  return mndKey(aar(), m);
}
function nyttSkjema(sykkelId) {
  const maaned = standardMnd();
  return { sykkel_id: sykkelId || '', maaned, skjema: skjemaForMnd(Number(maaned.slice(5))), dato: idag(), km: '', bilde_avis: '', kjoreforbud: false, frist: '', merknad: '' };
}
const punktIder = () => (!F || F.skjema === 'egen' ? [] : F.skjema === 'enkel' ? ENKEL.map(([id]) => id) : PUNKTER);
let utkastAdvart = false;
function lagreUtkast() {
  if (!F) return;
  try { localStorage.setItem('tk_utkast', JSON.stringify(F)); }
  catch (e) {
    try { localStorage.setItem('tk_utkast', JSON.stringify(Object.assign({}, F, { bilder: [] }))); } catch (x) { /* ignore */ }
    if (F.bilder && F.bilder.length && !utkastAdvart) { utkastAdvart = true; toast(t('utkastBilder'), true); }
  }
}
function hentUtkast() {
  try {
    const u = JSON.parse(hent('tk_utkast') || 'null');
    if (u && !u.maaned) { u.maaned = standardMnd(); u.skjema = skjemaForMnd(Number(u.maaned.slice(5))); }
    return u;
  } catch (e) { return null; }
}
const harInnhold = f => f && [...PUNKTER, ...ENKEL.map(([id]) => id)].some(p => f[p] !== undefined && f[p] !== '');

function startKontroll(id) {
  if (!F) F = hentUtkast();
  if (harInnhold(F) && F.sykkel_id && F.sykkel_id !== id && !confirm(t('annenSykkelUtkast'))) return;
  if (!F || F.sykkel_id !== id) { F = nyttSkjema(id); forhandsutfyll(); }
  lagreUtkast(); lukkAlle(); S.fane = 'kontroll'; render(); scrollTo(0, 0);
}

function knapp2(key, valg, verdi, klasse) {

      ${forrige && forrige.merknad ? `<div class="banner ${Number(forrige.sum_allmenn) >= 1 ? 'v1' : 'info'}" style="font-weight:550">${esc(t('forrigeMerknad', fmtDato(forrige.dato), forrige.merknad))}</div>` : ''}
      <label class="felt"><span>${t('maaned')}</span><select data-f="maaned">

      </select></label>
      ${F.skjema !== 'egen' ? `<div class="skjemavalg"><span class="dempet">${t('skjemaFor', t('sk_' + F.skjema), Mnd(fm))}</span>
        <button type="button" class="lenkeknapp" data-a="byttSkjema">${stor ? t('brukEnkel') : t('brukStor')}</button></div>` : ''}
      ${sammeMnd ? `<div class="banner info" style="margin-top:10px">${t('finnesAllerede', mndNavn(fm), fmtDato(sammeMnd.dato))}</div>` : ''}
      <div class="rad2" style="margin-top:10px"><label class="felt"><span>${t('dato')}</span><input type="date" data-f="dato" value="${esc(F.dato)}"></label>
        <label class="felt"><span>${t('km')}</span><input data-f="km" inputmode="numeric" value="${esc(F.km)}" placeholder="${FORRIGE.km ? esc(t('sist', FORRIGE.km)) : ''}"></label></div>
      ${stor ? `<span class="felt-tittel">${t('bildeAvisLevert')}</span>${knapp2('bilde_avis', [['Ja', t('levert')], ['Nei', t('ikkeLevert'), true]], F.bilde_avis)}` : ''}

      <p class="dempet" style="margin:0">${t('bilderHint')}</p>
      ${ventendeBilder(F.bilder)}${bildeKnapper(stor ? ['km', 'avis', 'annet'] : ['km', 'annet'])}</div>
    <button type="button" class="bred" data-a="alleBra">${t('alleOk')}</button>
    ${stor
      ? SEKSJONER.map(s => `<div class="kort"><h3>${t(s.t)}</h3>${s.r.map(p => punktRad(p.id, t(p.n), p.x)).join('')}</div>`).join('') + `

      : `<div class="kort"><h3>${t('sk_enkel')}</h3><p class="dempet" style="margin:0 0 4px">${t('enkelHint')}</p>${ENKEL.map(([id, n]) => punktRad(id, t(n))).join('')}</div>`}

function oppdaterStatus() {
  const el = $('#statusBanner');
  if (!el || !F) return;
  const ider = punktIder();
  const satt = ider.filter(p => F[p] !== undefined && F[p] !== '');
  const maks = satt.length ? Math.max(...satt.map(p => Number(F[p]))) : -1;
  const mangler = ider.length - satt.length;
  const cb = $('[data-f="kjoreforbud"]');
  if (cb) { cb.disabled = maks === 2; cb.checked = maks === 2 || !!F.kjoreforbud; }
  let tekst, kl;
  if (maks === 2) { tekst = t('stForbud'); kl = 'v2'; }
  else if (F.kjoreforbud) { tekst = t('stForbudManuelt'); kl = 'v2'; }
  else if (maks === 1) { tekst = t('stBor'); kl = 'v1'; }
  else if (maks === 0) { tekst = t('stOk'); kl = 'v0'; }
  else { tekst = t('stIngen'); kl = ''; }
  if (mangler && satt.length) tekst += mangler === 1 ? t('stGjen1') : t('stGjenN', mangler);
  el.className = 'banner ' + kl; el.textContent = tekst;
}

const WP = {};                 // cache per year
let wpAvd = 'Alle';
function visWolfpack() {
  const aar = S.wpAar || new Date().getFullYear();
  return `<h2>${esc(t('wpTittel', aar))} 🐺</h2>
    <p class="dempet" style="margin-top:-8px">${t('wpPeriode')}</p>
    <div class="faner2" style="margin-bottom:14px">
      <button type="button" data-wp-avd="Alle" class="${wpAvd === 'Alle' ? 'aktiv' : ''}">${t('wpAlle')}</button>
      <button type="button" data-wp-avd="${esc(meg().avdeling)}" class="${wpAvd !== 'Alle' ? 'aktiv' : ''}">${esc(meg().avdeling)}</button></div>
    <div id="wolfpack"><div class="laster" style="min-height:30vh"><div><div class="spinn"></div>${t('wpLaster')}</div></div></div>
    <p class="dempet" style="margin-top:14px">${t('wpForklaring')}</p>
    <h3>${t('wp_nivaa')}</h3>
    <div class="wpnivaa">${[...WP_NIVAA].reverse().map(n => `<span>${wpMerke(n)} ${kmNr(n[0])} km</span>`).join('')}</div>
    <p class="dempet">${t('wp_merk')}</p>
    ${hbAlleKap().some(k => k.wolfpack) ? `<button class="bred" data-hb-kapittel="${hbAlleKap().findIndex(k => k.wolfpack)}">📜 ${t('wp_regler')}</button>` : ''}`;
}
async function lastWolfpack() {
  const aar = S.wpAar || new Date().getFullYear();
  try {
    if (!WP[aar]) WP[aar] = await api('wolfpack', { aar });
    tegnWolfpack(WP[aar]);
  } catch (e) { const el = $('#wolfpack'); if (el) el.innerHTML = `<div class="banner v1">${esc(e.message)}</div>`; }
}
const WP_NIVAA = [[50000, 'Platina', 'platina'], [35000, 'Gold', 'gold'], [25000, 'Black', 'black'], [15000, 'Red', 'red']];
const wpNivaa = km => WP_NIVAA.find(([g]) => km >= g) || null;
const wpNeste = km => [...WP_NIVAA].reverse().find(([g]) => km < g) || null;
const wpMerke = n => n ? `<span class="wpmerke ${n[2]}">${n[1].toUpperCase()}</span>` : '';
function tegnWolfpack(d) {
  const el = $('#wolfpack');
  if (!el) return;
  const liste = d.liste.filter(p => wpAvd === 'Alle' || p.avdeling === wpAvd);
  if (!liste.length) { el.innerHTML = `<p class="tom">${t('wpIngen')}</p>`; return; }
  const maks = liste[0].km;
  const medalje = ['🥇', '🥈', '🥉'];
  el.innerHTML = `<div class="wp">${liste.map((p, i) => `<div class="wprad${i === 0 ? ' forst' : ''}">
      <div class="wpnr">${medalje[i] || i + 1}</div>
      <div class="wpinfo"><div class="linje1"><b>${esc(p.navn)}${wpMerke(wpNivaa(p.beste ?? p.km))}</b><span class="wpkm">${kmNr(p.km)} km</span></div>
        <div class="wpbar"><span style="width:${Math.max(2, Math.round(p.km / maks * 100))}%"></span></div>
        <div class="dempet" style="font-size:12.5px">${esc(p.avdeling)}${p.sykler > 1 ? ' · ' + esc(t('wpSykler', p.sykler)) : ''}${(() => { const b = p.beste ?? p.km, n = wpNeste(b); return n ? ' · ' + esc(t('wp_tilNeste', kmNr(n[0] - b), n[1])) : ''; })()}</div></div></div>`).join('')}</div>`;
}

function sistKmEgen(sykkelId) {
  if (!sykkelId) return '';

  return v ? t('sist', v.km) : '';

// ─── Handbook (Road Rules and Hand Signals – English, like the club) ──
const HB = {"title":"Road Rules and Hand Signals","chapters":[{"h":"Introduction","body":[{"p":"Motorcycle club riding is based on discipline, communication, awareness and mutual respect. This guide establishes common procedures for group riding, formations, communication and safety."},{"p":"Everyone who rides with the pack is expected to know the contents of this guide. New members ride their first trips next to an experienced rider, and the Road Captain goes through the most important signals before departure."},{"p":"The rules in this guide never override Norwegian traffic law. The pack obeys traffic lights, speed limits and road markings like any other road user."}]},{"h":"Roles in the Pack","body":[{"h3":"The Road Captain"},{"p":"The Road Captain is responsible for route planning, safety, formations, communication and the overall movement of the group."},{"b":["Plans the route, breaks and fuel stops in advance.","Holds the briefing before departure.","Rides at the front, sets the pace and gives the hand signals.","Chooses the formation according to road, weather and traffic.","Decides when the pack overtakes, changes lanes or stops."]},{"h3":"Assistant Road Captain"},{"p":"Assistant Road Captains support the Road Captain, assist with traffic control, relay signals and help maintain group integrity."},{"b":["Takes over as leader if the Road Captain has to leave the pack.","Makes sure signals are passed through the whole formation.","Keeps an eye on riders who fall behind or have problems."]},{"h3":"Tail Gunner"},{"p":"The Tail Gunner rides last and is the Road Captain's eyes at the back of the pack. The Tail Gunner should be an experienced rider."},{"b":["Watches the whole formation and the traffic behind.","Secures the lane when the pack changes lanes or overtakes (see Claim the Lane).","Stops with any rider who breaks down or has to leave the pack, and informs the Road Captain.","Never overtakes the pack."]},{"h3":"Every Rider"},{"b":["Keeps position and spacing in the formation.","Repeats hand signals to the riders behind.","Rides their own ride – never faster than they are comfortable with. Nobody is left behind for riding safely."]}]},{"h":"Road Hierarchy","body":[{"p":"Road hierarchy provides structure and predictability. Safety always takes priority over tradition."},{"b":["The Road Captain leads at the front, followed by the Assistant Road Captain(s).","Experienced members ride in the front part of the pack.","New members and prospects ride in the middle, next to an experienced rider.","The Tail Gunner rides last.","Riders keep the position they were given at departure. Changing position is done at stops, not on the road."]}]},{"h":"Formations","body":[{"p":"Side-by-side formation is the preferred formation for most riding situations. Staggered and single file are used when conditions require."},{"h3":"Side-by-Side (standard)"},{"p":"Two riders share the lane, each in their own half. The more experienced rider takes the inside (left) position."},{"b":["Keep a comfortable distance to the rider beside you, so both of you can move within your half of the lane.","Keep about two seconds to the pair in front.","Ride side by side with the rider next to you – not slightly ahead or behind.","If one rider has to avoid a hazard, the other gives room."]},{"h3":"Staggered"},{"p":"Riders alternate between the left and right part of the lane, so there is more space in front of every rider."},{"b":["About one second to the rider diagonally in front, two seconds to the rider directly in front.","Used on narrower roads, in poor road conditions and when the Road Captain signals it."]},{"h3":"Single File"},{"p":"All riders in one line in the same track."},{"b":["At least two seconds to the rider in front.","Used on narrow and winding roads, in tight curves, on gravel and poor asphalt, in road works and when visibility is poor."]},{"h3":"When to change formation"},{"p":"The Road Captain changes from side-by-side to staggered or single file when there is not enough room for two riders in the lane:"},{"b":["Tight curves and narrow or winding roads.","Gravel, potholes, wet leaves or other poor road surface.","Rain, darkness, fog or low sun.","Road works, tunnels and narrow bridges.","Heavy traffic and when the pack is being overtaken."]},{"p":"The pack returns to side-by-side when the Road Captain gives the signal."}]},{"h":"Riding Procedures","body":[{"h3":"Before the ride"},{"b":["Arrive with a full tank and a motorcycle that has passed the monthly technical inspection.","The Road Captain holds a short briefing: route, breaks, formation, Tail Gunner and any special hazards.","Everyone confirms that they know the route to the first stop, in case the pack is split."]},{"h3":"Departure"},{"p":"The Road Captain gives the Start Engines signal. The pack leaves the parking area in single file and forms up once on the road."},{"h3":"Intersections and traffic lights"},{"b":["The pack never runs a red light to stay together.","If the pack is split, the front part slows down or stops at a safe place and waits for the rest.","In queues, tighten up in pairs so the pack takes as little space as possible."]},{"h3":"Changing lanes and overtaking on the motorway"},{"p":"On the motorway the pack uses the Claim the Lane signal (see Hand Signal Reference). The Tail Gunner secures the left lane first, and the rest of the pack moves out behind the Tail Gunner's protection. The Tail Gunner only moves out when the lane is clear – other traffic is never forced to brake."},{"h3":"Fuel and breaks"},{"b":["The Road Captain plans fuel stops based on the motorcycle with the shortest range.","Any rider who needs to stop – for fuel, a toilet break or anything else – points at the fuel tank. The signal is relayed to the Road Captain and the pack stops at the next station.","At stops, park together and leave the exit free."]},{"h3":"Breakdown or a rider leaving the pack"},{"b":["A rider with a problem signals, uses the indicator and pulls over where it is safe.","The Tail Gunner stops with the rider. The pack continues to a safe place and waits.","Hazard lights on, everyone off the roadway and behind the guardrail where possible."]},{"h3":"Accident"},{"n":["Secure the scene: hazard lights, warning triangle and high-visibility vest. Stop traffic if necessary.","Call 113 (ambulance) – and 112 (police) / 110 (fire) when needed.","Give first aid. Do not remove the helmet unless it is necessary to keep the airway open.","Inform the Road Captain. The Road Captain decides what the rest of the pack does."]}]},{"h":"Safety","body":[{"p":"Every rider is responsible for safety, preparedness and maintaining a roadworthy motorcycle."},{"b":["The motorcycle passes the club's monthly technical inspection – registered in the RC Portal.","Full protective gear: helmet, jacket, gloves, trousers and boots.","No alcohol or drugs before or during a ride. The legal limit in Norway is 0.2 per mille; the recommended club standard is zero.","Rested and fit to ride. Tell the Road Captain if you need a break.","Carry driving licence, vehicle registration, health insurance card (EHIC) when abroad, and a phone with the Road Captain's number."]}]}],"signalsIntro":"Standardized hand signals ensure clear communication throughout the group. The club keeps hand signals to a minimum, so that every rider knows them all. Signals are given with the left hand – the right hand stays on the throttle. Every signal is repeated by the riders behind until it has reached the Tail Gunner.","groups":[{"h":"Departure and Direction","signals":[{"h":"Start Engines","img":"image2.jpg","purpose":"Signals the group to start their engines and prepare for departure.","how":"Raise your left hand with your index finger pointing upward and make a circular motion above your head.","when":"Used by the Road Captain when the group is ready to depart.","notes":["Wait until every rider has started and is ready before moving off."]},{"h":"Turn Left","img":"image3.jpg","purpose":"Signals to the group that the Road Captain intends to turn left at the next junction, exit, road, or change of direction.","how":"Extend your left arm straight out to the side and point clearly in the direction of the intended turn.","when":"Use well in advance of the turn so riders behind have sufficient time to observe and react to the signal.","notes":["Hold the signal long enough for the entire formation to see it.","Maintain a steady riding line while signaling.","Cancel the signal once the turn has been initiated.","The signal should be repeated by riders behind when appropriate to ensure it is relayed through the group."]},{"h":"Turn Right","img":"image4.jpg","purpose":"Signals to the group that the Road Captain intends to turn right at the next junction, exit or change of direction.","how":"Raise your left arm above your helmet and point clearly to the right.","when":"Use the signal well in advance of the turn to allow riders behind to relay the signal through the formation.","notes":["Right hand remains on the handlebar.","Hold the signal long enough for the entire formation to observe it.","Riders behind should relay the signal when appropriate.","This signal is used by BMC Norway to indicate a right turn."]}]},{"h":"Formation","signals":[{"h":"Claim the Lane","img":"claim-the-lane.jpg","club":true,"purpose":"Tells the Tail Gunner to move into the left lane and secure it, so that the pack can change lanes and overtake safely on the motorway.","how":"The leader raises the left arm with the upper arm straight out from the body at 90 degrees and the forearm pointing straight up, fist clenched with the index finger pointing up.","when":"Used on the motorway when the pack is going to overtake other vehicles.","steps":["The Road Captain gives the signal well in advance. It is relayed back through the pack to the Tail Gunner.","The Tail Gunner checks mirrors and blind spot. When the left lane is clear, the Tail Gunner indicates and moves out into the left lane.","The Tail Gunner holds the lane, so that approaching traffic is held back behind the pack.","The rest of the pack follows into the left lane from the back forwards. The Road Captain moves out last and leads the overtaking.","After the overtaking, the pack returns to the right lane from the front, with good distance to the overtaken vehicles. The Tail Gunner returns last."],"notes":["The club's most important signal on the motorway.","The Tail Gunner only moves out when the lane is clear. Other traffic is never forced to brake or cut off.","Overtake within the speed limit and return to the right lane as soon as it is safe.","Not the same as Single File: here the upper arm points straight out to the side, in an L-shape."]},{"h":"Side-by-Side","img":"side-by-side.jpg","proposed":true,"purpose":"Tells the pack to return to the standard side-by-side formation.","how":"Raise your left arm straight up with your index and middle finger extended.","when":"Used after single file or staggered riding, when the road again has room for two riders in the lane.","notes":["Pairs form up from the front, calmly and without sudden lane changes."]},{"h":"Staggered Formation","img":"staggered.jpg","proposed":true,"purpose":"Tells the pack to change to staggered formation.","how":"Raise your left arm straight up with your index and middle finger extended, and move your hand from side to side.","when":"Used when the lane is too narrow for side-by-side, but single file is not necessary.","notes":["About one second to the rider diagonally in front, two seconds to the rider directly in front."]},{"h":"Single File","img":"single-file.jpg","proposed":true,"purpose":"Tells the pack to form a single line.","how":"Raise your left arm straight up with only your index finger extended.","when":"Used on narrow and winding roads, in tight curves, road works, tunnels and poor road conditions.","notes":["The rider on the left falls in behind the rider on the right, or as the Road Captain has decided at the briefing.","Keep at least two seconds to the rider in front."]},{"h":"Tighten Formation","img":"tighten.jpg","proposed":true,"purpose":"Tells the pack to close up gaps and ride closer together.","how":"Raise your left arm with a clenched fist and move it up and down.","when":"Used when gaps have opened in the formation, before intersections and in slow traffic.","notes":["Close up gradually – never closer than the safe distance for the formation."]}]},{"h":"Speed","signals":[{"h":"Slow Down","img":"image8.jpg","purpose":"Signals the group to reduce speed in a controlled and predictable manner.","how":"Extend your left arm outward with your palm facing downward and move your hand up and down in a slow pumping motion.","when":"Used when approaching traffic, intersections, curves, hazards, road works, reduced visibility, or any situation requiring the group to slow down.","notes":["Reduce speed smoothly and gradually.","Avoid sudden braking whenever possible.","Riders behind should relay the signal through the formation.","Continue signaling until the group has reacted appropriately.","Maintain full control of the motorcycle while signaling."]},{"h":"Stop","img":"image9.jpg","purpose":"Signals the group to come to a controlled stop.","how":"Raise your left arm straight upward with your palm facing forward.","when":"Used when approaching stop signs, traffic lights, road closures, accidents, emergency situations, or any circumstance requiring the group to stop.","notes":["Begin slowing down smoothly after giving the signal.","Riders behind should relay the signal through the formation.","Avoid sudden braking whenever possible.","Maintain lane discipline while stopping.","Be prepared to place both feet on the ground once the motorcycle comes to a complete stop.","Continue signaling until the riders behind have acknowledged the instruction.","When riding with other clubs: the most common international stop signal is the left arm extended downward ven by any rider. The signal is relayed forward through the pack to the Road Captain, who confirms by repeating it.","notes":["One signal for every kind of stop – the club keeps hand signals to a minimum.","Give the signal in good time, not when the reserve light comes on.","A tired rider is a hazard to the whole pack – ask for a stop early."]}]}],"proposed":"Proposed signal – confirm with the club before printing."};

const INSTALL = { prompt: null };
const erInstallert = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const erIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const erMacSafari = () => /Macintosh/.test(navigator.userAgent) && /Safari\//.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Firefox/.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1);
/** 'prompt' (Android, Chrome/Edge desktop), 'ios', 'mac' (Safari) or null when installed / not possible. */
function installType() {
  if (erInstallert()) return null;
  if (INSTALL.prompt) return 'prompt';
  if (erIOS()) return 'ios';
  if (erMacSafari()) return 'mac';
  return null;
}
function installBanner() {

  return `<div class="kort install"><p>📲 ${t('inst_banner')}</p>

}

}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

const DEKK_MAKS_AAR = 6, BATTERI_MAKS_AAR = 5, MONSTER_MIN = 2;
/** Year from "2023", "04.2026", "mars 2026" or a DOT code like "3922" (week 39, 2022) / "123". */
function aarFra(v) {
  const s = String(v ?? '').trim();
  const dot = () => { const y = 2000 + Number(s.slice(-2)); return y <= aar() ? y : null; };
  if (/^\d{4}$/.test(s)) { const n = Number(s); return n >= 1990 && n <= aar() ? n : dot(); }
  if (/^\d{3}$/.test(s)) return dot();
  const m = s.match(/(?:19|20)\d{2}/);
  return m && Number(m[0]) <= aar() ? Number(m[0]) : null;
}
function sisteVerdi(sykkelId, felt) {
  const k = kontrollerFor(sykkelId).find(x => String(x[felt] ?? '').trim() !== '');
  return k ? String(k[felt]).trim() : '';
}
function varslerFor(sykkelId) {
  const v = [], na = aar();
  [['dekk_f', 'dekkF'], ['dekk_b', 'dekkB']].forEach(([f, navn]) => {
    const y = aarFra(sisteVerdi(sykkelId, f + '_dato'));
    if (y && na - y >= DEKK_MAKS_AAR) v.push({ tekst: t('v_dekkAlder', t(navn), y, na - y) });
    const mm = Number(sisteVerdi(sykkelId, f + '_mm').replace(',', '.'));
    if (mm > 0 && mm < MONSTER_MIN) v.push({ tekst: t('v_monster', t(navn), String(mm).replace('.', LANG === 'en' ? '.' : ',')) });
  });
  const b = aarFra(sisteVerdi(sykkelId, 'batteri_dato'));
  if (b && na - b >= BATTERI_MAKS_AAR) v.push({ tekst: t('v_batteri', b, na - b) });
  return v;
}
function oppfolgingPunkter() {
  const ut = [], am = aktivMnd(), y = String(aar());
  const settHk = {};
  S.d.sykler.filter(iAvd).forEach(s => {
    const i = sykkelInfo(s);
    if (i.forbud) ut.push({ g: 'of_forbud', s, tekst: i.k.frist ? t('fristDato', fmtDato(i.k.frist)) : t('utenFrist'), kl: 'rodt' });
    else if (i.frist) ut.push({ g: 'of_frist', s, tekst: t('fristDato', fmtDato(i.k.frist)) + ' · ' + esc(i.k.merknad || ''), kl: 'rodt' });
    if (i.manglerNa) ut.push({ g: 'of_mangler', s, purr: true });
    const e = egenFor(s.telefon).find(x => String(x.dato).startsWith(y));
    const hk = e && e.helsetrygdekort_utloper;
    if (hk && hk < omDager(60) && !settHk[s.telefon]) { settHk[s.telefon] = 1; ut.push({ g: 'of_papirer', s, tekst: hk < idag() ? t('hkUtlopt') : t('hkUtloper', fmtDato(hk)), kl: 'oransje' }); }
    const v = varslerFor(s.id);
    if (v.length) ut.push({ g: 'of_slitasje', s, linjer: v.map(x => x.tekst) });

  return ut;
}

    ${liste.map((u, i) => `${S.avd === 'Alle' && (i === 0 || liste[i - 1].avdeling !== u.avdeling) ? `<h3>${esc(u.avdeling)} · ${t('antMedlemmer', antIAvd(u.avdeling))}</h3>` : ''}<button class="kort" data-bruker="${esc(u.telefon)}">
      <div class="linje1"><b>${esc(u.navn)}</b>${brukerStatus(u)}</div>
      <div class="dempet">${esc(u.telefon)} · ${antSykler(u.telefon)}${!u.harPassord && u.kode ? ' · ' + t('kode', esc(u.kode)) : ''}</div>
      ${u.sistAktiv ? `<div class="dempet" style="font-size:12.5px">${esc(t('sistAktiv', fmtAktiv(u.sistAktiv)))}</div>` : ''}</button>`).join('') || `<p class="tom">${t('ingenMedlemmer')}</p>`}`;
}

function smsLenke(u, kode) {
  const nr = /^\d{8}$/.test(u.telefon) ? '+47' + u.telefon : u.telefon;
  const url = location.origin + location.pathname;
  return `sms:${nr}?&body=${encodeURIComponent(t('smsTekst', u.navn.split(' ')[0], url, kode))}`;
}

function visBruker(tlf) {
  const u = tlf ? S.d.brukere.find(x => x.telefon === tlf) : null;
  if (tlf && !u) return tilbake();
  const nokkel = tlf || 'ny';
  if (!B || B._for !== nokkel) B = { _for: nokkel, telefon: u ? u.telefon : '', navn: u ? u.navn : '', avdeling: u ? u.avdeling : (rolle() === 'admin' && S.avd !== 'Alle' ? S.avd : meg().avdeling), rolle: u ? u.rolle : 'medlem', aktiv: u ? u.aktiv : true };
  const admin = rolle() === 'admin';
  const erMeg = u && u.telefon === meg().telefon;
  const kanEndre = admin || (u ? u.rolle === 'medlem' && u.avdeling === meg().avdeling : true);
  const sykler = u ? S.d.sykler.filter(s => s.telefon === u.telefon) : [];
  tegnLag(u ? u.navn : t('nyttMedlem'), `<div data-skjema="B">
    ${u && !u.harPassord && u.kode ? `<div class="kort"><h3>${t('aktivering')}</h3><p>${esc(t('ikkeLagetPassord', u.navn.split(' ')[0]))}</p>
      <div class="kodeboks"><b>${esc(u.kode)}</b><span class="dempet">${t('gjelderTil', fmtDato(u.kode_utloper))}</span></div>
      <a class="knapp primar bred" href="${esc(smsLenke(u, u.kode))}">${t('sendSms')}</a></div>` : ''}
    ${u ? profilKort(u.telefon) : ''}
    ${u && 'sistAktiv' in u ? `<div class="kort"><dl class="info">
      <dt>${t('sistAktivTittel')}</dt><dd>${u.sistAktiv ? esc(fmtAktiv(u.sistAktiv)) : `<span class="oransje">${t('sistAktivAldri')}</span>`}</dd>
      <dt>${t('sistInnlogget')}</dt><dd>${u.sistInnlogget ? esc(fmtAktiv(u.sistInnlogget)) : '–'}</dd></dl></div>` : ''}
    <div class="kort">
      <label class="felt"><span>${t('navn')}</span><input data-f="navn" value="${esc(B.navn)}" ${kanEndre ? '' : 'readonly'} autocomplete="off"></label>
      <label class="felt"><span>${t('telefon')}${u ? t('brukernavn') : ''}</span><input data-f="telefon" type="tel" inputmode="tel" value="${esc(B.telefon)}" ${u ? 'readonly' : ''} autocomplete="off"></label>
      ${admin ? `<label class="felt"><span>${t('avdeling')}</span><select data-f="avdeling">${S.d.avdelinger.map(a => `<option value="${esc(a)}"${a === B.avdeling ? ' selected' : ''}>${esc(a)}</option>`).join('')}</select></label>
        <label class="felt"><span>${t('rolle')}</span><select data-f="rolle" ${erMeg ? 'disabled' : ''}>${['medlem', 'rc', 'officer', 'admin'].map(r => `<option value="${r}"${r === B.rolle ? ' selected' : ''}>${t('r_' + r)}${r === 'admin' ? t('rolleAdminHint') : r === 'officer' ? t('rolleOfficerHint') : r === 'rc' ? t('rolleRcHint') : ''}</option>`).join('')}</select></label>`
      : `<p class="dempet">${t('avdeling')}: ${esc(B.avdeling)} · ${t('rolle')}: ${t('r_' + B.rolle)}</p>`}
      ${u && !erMeg && kanEndre ? `<label class="sjekk"><input type="checkbox" data-f="aktiv" ${B.aktiv ? 'checked' : ''}> ${t('aktivCb')}</label>` : ''}
    </div>
    ${kanEndre ? `<button type="button" class="primar bred" data-a="lagreBruker">${u ? t('lagreEndringer') : t('leggTilKode')}</button>` : `<p class="dempet">${t('barAdminEndre')}</p>`}
    ${u ? `<h3>${t('sykler')}</h3>
      ${sykler.map(s => `<button class="kort" data-sykkel="${esc(s.id)}"><b>${esc(s.regnr)}</b> <span class="dempet">${esc(s.modell)}</span></button>`).join('') || `<p class="tom">${t('ingenSyklerKort')}</p>`}
      ${kanEndre || erMeg ? `<button class="bred" data-sykkel-skjema="" data-eier="${esc(u.telefon)}">${t('leggTilSykkel')}</button>` : ''}
      ${!erMeg && kanEndre && u.aktiv ? `<h3>${t('passordTittel')}</h3><button type="button" class="bred" data-a="nyKode">${u.harPassord ? t('glemtKode') : t('lagNyKode')}</button>
        ${u.harPassord ? `<p class="dempet">${t('glemtHint')}</p>` : ''}` : ''}` : ''}
  </div>`);
}

// ─── Account ────────────────────────────────────────────────
function visKonto() {
  const b = meg();
  return `<h2>${t('konto')}</h2>
    <div class="kort"><dl class="info"><dt>${t('navn')}</dt><dd>${esc(b.navn)}</dd><dt>${t('telefonKort')}</dt><dd>${esc(b.telefon)}</dd>
      <dt>${t('avdeling')}</dt><dd>${esc(b.avdeling)}</dd><dt>${t('rolle')}</dt><dd>${t('r_' + b.rolle)}</dd></dl></div>
    <h3>${t('sprak')}</h3>
    <div class="kort" style="padding:10px">${sprakKnapper().replace('margin-top:18px', '')}</div>
    <h3>${t('byttPassord')}</h3>
    <form id="pwSkjema" class="kort">
      <input type="text" name="u" autocomplete="username" value="${esc(b.telefon)}" hidden>
      <label class="felt"><span>${t('navaerende')}</span><input name="gammelt" type="password" autocomplete="current-password" required></label>
      <label class="felt"><span>${t('nyttPassord')}</span><input name="nytt" type="password" autocomplete="new-password" minlength="6" required></label>
      <label class="felt"><span>${t('gjentaNytt')}</span><input name="nytt2" type="password" autocomplete="new-password" minlength="6" required></label>
      <button class="bred" style="margin:0">${t('byttPassord')}</button></form>
    ${tilbakeUrl() ? `<h3>${t('tilbakemelding')}</h3><div class="kort"><p class="dempet">${t('tilbakeHint')}</p>
      <a class="knapp bred" style="margin:0" href="${esc(tilbakeUrl())}">${t('tilbakemelding')}</a></div>` : ''}
    ${installType() ? `<h3>${t('inst_tittel')}</h3><div class="kort"><p class="dempet">${t('inst_konto')}</p>
      <button type="button" class="bred" style="margin:0" data-a="installer">${t('inst_knapp')}</button></div>`
      : erInstallert() ? `<p class="dempet">${t('inst_ferdig')}</p>` : ''}
    <details class="kort"><summary>${t('personvern')}</summary>${t('personvernTekst')}</details>
    <button class="fare bred" data-a="loggUt">${t('loggUt')}</button>
    <button class="bred" data-a="oppdater">${t('hentPaNytt')}</button>`;
}

// ─── Actions ────────────────────────────────────────────────
const A = {
  alleBra() { punktIder().forEach(p => { if (F[p] === undefined || F[p] === '') F[p] = 0; }); lagreUtkast(); render(); toast(t('alleOkToast')); },
  byttSkjema() { F.skjema = F.skjema === 'stor' ? 'enkel' : 'stor'; lagreUtkast(); render(); },
  forkastKontroll() { if (!confirm(t('tommeSkjema'))) return; F = nyttSkjema(F && F.sykkel_id); forhandsutfyll(); lagreUtkast(); render(); },
  async lagreKontroll(btn) {
    if (!F.sykkel_id) { toast(t('velgSykkelToast'), true); return $('[data-f="sykkel_id"]').focus(); }
    const ider = punktIder();
    const mangler = ider.filter(p => F[p] === undefined || F[p] === '');
    $$('.punkt').forEach(el => el.classList.toggle('mangler', mangler.includes(el.dataset.punkt)));
    if (mangler.length) {
      toast(mangler.length === 1 ? t('ikkeVurdert1') : t('ikkeVurdertN', mangler.length), true);
      $(`[data-punkt="${mangler[0]}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const maks = Math.max(...ider.map(p => Number(F[p])));
    if ((maks === 2 || F.kjoreforbud) && !F.frist && !confirm(t('ingenFrist'))) return;
    await medKnapp(btn, async () => {
      const id = F.sykkel_id;
      const bilder = F.bilder || [];
      const r = await api('lagreKontroll', { kontroll: Object.assign({}, F, { bilder: undefined, _forhand: undefined, _forhandVerdi: undefined }) });
      F = null; lagre('tk_utkast', null);
      const feil = await lastOppBilder(bilder, 'kontroll', r.id, btn);
      await lastData(); S.fane = 'oversikt'; render(); scrollTo(0, 0);
      apne(() => visSykkel(id));
      if (feil) { apne(() => visKontroll(r.id)); toast(feil + t('provHer'), true); }
      else toast(t('lagret'));
    });
  },
  alleOk() { EGEN_SJEKK.forEach(([, r]) => r.forEach(([id]) => { if (!G[id]) G[id] = 'OK'; })); visEgenSkjema(); },
  async lagreEgen(btn) {
    if (!G.sykkel_id) return toast(t('velgSykkelToast'), true);
    if (!G.bekreftet) return toast(t('egenBekreftToast'), true);
    await medKnapp(btn, async () => {
      const bilder = G.bilder || [];
      const r = await api('lagreEgenerklaering', { egenerklaering: Object.assign({}, G, { bilder: undefined }) });
      G = null;
      const feil = await lastOppBilder(bilder, 'egen', r.id, btn);
      lukkAlle(); await lastData(); render();
      if (feil) { apne(() => visEgen(r.id)); toast(feil + t('provHer'), true); }
      else toast(t('egenSendt'));
    });
  },
  async slaOpp(btn) {
    if (!String(B.regnr || '').trim()) { toast(t('regnr'), true); return $('[data-f="regnr"]').focus(); }
    await medKnapp(btn, async () => {
      const k = await api('slaOppKjoretoy', { regnr: B.regnr });
      const harley = /harley/i.test(k.merke || '');
      if (k.modell) B.modell = (harley || !k.merke ? '' : k.merke + ' ') + k.modell;
      if (k.aarsmodell) B.aarsmodell = String(k.aarsmodell);
      if (k.vin) B.vin = k.vin;
      B._funnet = t('funnet', [k.merke, k.modell, k.aarsmodell].filter(Boolean).join(' ')) + (k.forstegang ? ' · ' + t('forstegang', fmtDato(k.forstegang)) : '');
      LAG[LAG.length - 1]();
    });
  },
  async lagreSykkel(btn) {
    await medKnapp(btn, async () => {
      await api('lagreSykkel', { sykkel: { id: B.id, telefon: B.telefon, regnr: B.regnr, modell: B.modell, aarsmodell: B.aarsmodell, vin: B.vin || '' } });
      B = null; await lastData(); tilbake(); render(); toast(t('sykkelLagret'));
    });
  },
  async fjernSykkel(btn) {
    if (!confirm(t('fjernSporsmal'))) return;
    await medKnapp(btn, async () => {
      await api('lagreSykkel', { sykkel: { id: B.id, aktiv: false } });
      B = null; await lastData(); tilbake(); render(); toast(t('sykkelFjernet'));
    });
  },
  async lagreBruker(btn) {
    const ny = B._for === 'ny';
    await medKnapp(btn, async () => {
      const r = await api('lagreBruker', { bruker: { telefon: B.telefon, navn: B.navn, avdeling: B.avdeling, rolle: B.rolle, aktiv: B.aktiv, nytt: ny } });
      await lastData();
      if (ny) {
        const u = S.d.brukere.find(x => r.kode && x.kode === r.kode);
        B = null; LAG.pop();
        if (u) apne(() => visBruker(u.telefon)); else lukkAlle();
        toast(t('medlemLagtTil'));
      } else { B = null; LAG[LAG.length - 1](); toast(t('lagretToast')); }
      render();
    });
  },
  async nyKode(btn) {
    if (!confirm(t('nyKodeSporsmal'))) return;
    await medKnapp(btn, async () => {
      await api('nyKode', { telefon: B.telefon });
      await lastData();
      B = null; LAG[LAG.length - 1](); render();
      toast(t('nyKodeLaget'));
    });
  },
  loggUt() { loggUt(); },
  oppfolging() { apne(visOppfolging); },
  async installer() {
    const ty = installType();
    if (ty === 'prompt') {
      INSTALL.prompt.prompt();
      const valg = await INSTALL.prompt.userChoice.catch(() => ({}));
      INSTALL.prompt = null;
      if (valg && valg.outcome === 'accepted') lagre('tk_inst_skjul', '1');
      return oppdaterInstall();
    }
    if (ty === 'ios' || ty === 'mac') apne(() => tegnLag(t('inst_tittel'), `<div class="kort">${t(ty === 'ios' ? 'inst_ios' : 'inst_mac', svg(IKON.del))}</div>`));
  },
  skjulInstall() { lagre('tk_inst_skjul', String(Date.now())); oppdaterInstall(); },
  statistikk() { apne(visStatistikk); },
  async oppdater(btn) { await medKnapp(btn, async () => { await oppdaterAlt(); toast(t('oppdatert')); }); },
  async slettBilde(btn) {
    if (!confirm(t('slettBildeSp'))) return;
    await medKnapp(btn, async () => {
      await api('slettBilde', { id: btn.dataset.slettBilde });
      await lastData(); tilbake(); render(); toast(t('bildeSlettet'));
    });
  },
  async slettKontroll(btn) {
    if (!confirm(t('slettKontrollSp'))) return;
    await medKnapp(btn, async () => {
      await api('slettKontroll', { id: btn.dataset.slettKontroll });
      await lastData(); tilbake(); render(); toast(t('kontrollSlettet'));
    });
  }
};

// ─── Events ─────────────────────────────────────────────────
function skjemaFor(el) { const s = el.closest('[data-skjema]'); return s ? { navn: s.dataset.skjema, obj: SKJEMA[s.dataset.skjema]() } : null; }
function etterEndring(navn) { if (navn === 'K') { lagreUtkast(); oppdaterStatus(); } }

document.addEventListener('click', ev => {
  const el = ev.target.closest('button, a');
  if (!el || el.disabled) return;
  const ds = el.dataset;
  if ('tilbake' in ds) return tilbake();
  if ('sprak' in ds) return settSprak(ds.sprak);
  if ('modus' in ds) return visLogin(ds.modus);
  if ('fane' in ds) { S.fane = ds.fane; lukkAlle(); render(); return scrollTo(0, 0); }
  if ('filter' in ds) { S.filter = S.filter === ds.filter ? 'alle' : ds.filter; return render(); }
  if ('wpAvd' in ds) { wpAvd = ds.wpAvd; $$('[data-wp-avd]').forEach(b => b.classList.toggle('aktiv', b === el)); const aar = S.wpAar || new Date().getFullYear(); if (WP[aar]) tegnWolfpack(WP[aar]); return; }
  if ('sett' in ds) {
    const sk = skjemaFor(el); if (!sk || !sk.obj) return;
    const v = 'num' in ds ? Number(ds.v) : ds.v;
    sk.obj[ds.sett] = ('toggle' in ds && sk.obj[ds.sett] === v) ? '' : v;
    $$(`[data-sett="${ds.sett}"]`, el.parentElement).forEach(b => b.classList.toggle('valgt', sk.obj[ds.sett] === ('num' in b.dataset ? Number(b.dataset.v) : b.dataset.v)));
    const p = el.closest('.punkt'); if (p) p.classList.remove('mangler');
    return etterEndring(sk.navn);
  }
  if ('sykkel' in ds) return apne(() => visSykkel(ds.sykkel));
  if ('kontroll' in ds) return apne(() => visKontroll(ds.kontroll));
  if ('egen' in ds) return apne(() => visEgen(ds.egen));
  if ('egenNy' in ds) return startEgen(ds.egenNy);
  if ('nyKontroll' in ds) return startKontroll(ds.nyKontroll);
  if ('sykkelSkjema' in ds) { B = null; const id = ds.sykkelSkjema, eier = ds.eier || ''; return apne(() => visSykkelSkjema(id, eier)); }
  if ('bruker' in ds) { B = null; const tlf = ds.bruker; return apne(() => visBruker(tlf)); }
  if ('purret' in ds) { el.classList.add('sendt'); el.textContent = t('smsSendt'); PURRET[ds.purret] = true; return; }
  if ('slettKontroll' in ds) return A.slettKontroll(el);
  if ('slettBilde' in ds) return A.slettBilde(el);
  if ('visBilde' in ds) return apne(() => visBilde(ds.visBilde));
  if ('fjernBilde' in ds) {
    const sk = skjemaFor(el); if (!sk || !sk.obj || !sk.obj.bilder) return;
    sk.obj.bilder.splice(Number(ds.fjernBilde), 1);
    if (sk.navn === 'K') { lagreUtkast(); render(); } else visEgenSkjema();
    return;
  }
  if (ds.a && A[ds.a]) return A[ds.a](el);
});

function feltEndret(ev) {
  const el = ev.target;
  if (el.matches('input[data-bilde]')) { if (ev.type === 'change') velgBilder(el); return; }
  if (el.matches('[data-avd]')) { S.avd = el.value; lagre('tk_avd', S.avd); if (S.fane === 'kontroll' && F) F.sykkel_id = ''; return render(); }
  if (!el.matches('[data-f]')) return;
  const sk = skjemaFor(el); if (!sk || !sk.obj) return;
  sk.obj[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
  if (sk.navn === 'K' && ev.type === 'change' && (el.dataset.f === 'sykkel_id' || el.dataset.f === 'maaned')) {
    if (el.dataset.f === 'maaned') F.skjema = skjemaForMnd(Number(F.maaned.slice(5)));
    if (el.dataset.f === 'sykkel_id') forhandsutfyll();
    lagreUtkast(); return render();
  }
  if (sk.navn === 'G' && ev.type === 'change' && el.dataset.f === 'sykkel_id') return visEgenSkjema();
  etterEndring(sk.navn);
}
document.addEventListener('input', feltEndret);
document.addEventListener('change', feltEndret);

document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'pwSkjema') return;
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  if (f.nytt !== f.nytt2) return toast(t('nyeUlike'), true);
  await medKnapp($('button', ev.target), async () => {
    const r = await api('byttPassord', { gammelt: f.gammelt, nytt: f.nytt });
    S.token = r.token; lagre('tk_token', r.token); ev.target.reset(); toast(t('passordByttet'));
  });
});

// ─── Start ──────────────────────────────────────────────────
(async function start() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'no';
  document.title = t('app');
  if (API_URL.indexOf('http') !== 0) { $('#app').innerHTML = `<main><div class="banner v1">${t('apiMangler')}</div></main>`; return; }
  if (!S.token) return visLogin('login');
  try { await lastData(); render(); }
  catch (e) {
    if (e.kode === 'BYTT') return;
    if (S.token) {
      $('#app').innerHTML = `<main class="login"><div class="banner v1">${esc(e.message)}</div><button class="primar bred" onclick="location.reload()">${t('provIgjen')}</button><button class="bred" data-a="loggUt">${t('loggUt')}</button></main>`;
    }
  }
})();
</script>
</body>
