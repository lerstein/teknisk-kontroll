// ─── Actions ────────────────────────────────────────────────
const A = {
  alleBra() { punktIder().forEach(p => { if (F[p] === undefined || F[p] === '') F[p] = 0; }); lagreUtkast(); render(); toast(t('alleOkToast')); },
  byttSkjema() { F.skjema = F.skjema === 'stor' ? 'enkel' : 'stor'; lagreUtkast(); render(); },
  forkastKontroll() { if (!confirm(t('tommeSkjema'))) return; F = nyttSkjema(F && F.sykkel_id); forhandsutfyll(); lagreUtkast(); render(); },
  async lagreKontroll(btn) {
    if (!F.sykkel_id) { toast(t('velgSykkelToast'), true); return $('[data-f="sykkel_id"]').focus(); }
    const ider = punktIder();
    const mangler = ider.filter(p => F[p] === undefined || F[p] === '');
    $$('.punkt').forEach(el => el.classList.toggle('mangler', mangler.includes(el.dataset.punkt)));
    if (mangler.length) {
      toast(mangler.length === 1 ? t('ikkeVurdert1') : t('ikkeVurdertN', mangler.length), true);
      $(`[data-punkt="${mangler[0]}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    // a photo of both tyres is required on every inspection (not when an RC corrects one that already exists)
    const harDekk = ty => (F.bilder || []).some(b => b.type === ty);
    if (!F._retter && (!harDekk('dekk_f') || !harDekk('dekk_b'))) {
      toast(t('dekkBildeKrav'), true);
      const kort = $('main .bildeknapper'); if (kort) kort.closest('.kort').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (F.utbedret_for && !(F.bilder || []).some(b => b.type === 'annet')) {
      toast(t('utbedretBildeKrav'), true);
      const kort = $('main .bildeknapper'); if (kort) kort.closest('.kort').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    // warnings, not stops: double inspection, odometer lower than before or an unlikely jump (a replaced odometer is a legitimate exception)
    if (!F._retter) {
      const tidl = S.d.kontroller.filter(k => k.sykkel_id === F.sykkel_id && !(F.utbedret_for && k.id === F.utbedret_for));
      const sistKm = Math.max(0, ...tidl.map(k => Number(k.km) || 0));
      const km = Number(String(F.km || '').replace(/\s/g, '').replace(',', '.')) || 0;
      const varsler = [];
      if (tidl.some(k => k.maaned === F.maaned)) varsler.push(t('vDobbel', Mnd(Number(F.maaned.slice(5)))));
      if (km && sistKm && km < sistKm && !F.km_byttet) varsler.push(t('vKmLav', fmtKm(km), fmtKm(sistKm)));
      else if (km && sistKm && km - sistKm > 15000) varsler.push(t('vKmHopp', fmtKm(km - sistKm)));
      if (varsler.length && !confirm(varsler.join('\n\n') + '\n\n' + t('vLagreLikevel'))) return;
    }
    const neste = btn.dataset.neste ? nesteSykler() : [];
    const nesteMnd = F.maaned;
    const maks = Math.max(...ider.map(p => Number(F[p])));
    if ((maks === 2 || F.kjoreforbud) && !F.frist && !confirm(t('ingenFrist'))) return;
    await medKnapp(btn, async () => {
      const id = F.sykkel_id;
      const bilder = F.bilder || [];
      const data = Object.assign({}, F, { bilder: undefined, _forhand: undefined, _forhandVerdi: undefined, _retter: undefined });
      const retter = F._retter;
      const r = retter ? Object.assign(await api('godkjennKontroll', { id: retter, handling: 'godkjenn', kontroll: data }), { id: retter })
                       : await api('lagreKontroll', { kontroll: data });
      F = null; lagre('tk_utkast', null);
      const feil = await lastOppBilder(bilder, 'kontroll', r.id, btn);
      await lastData();
      if (neste.length && !feil) {   // inspection evening: straight on to the next bike missing this month
        F = nyttSkjema(neste[0].id); F.maaned = nesteMnd; F.skjema = skjemaForMnd(Number(nesteMnd.slice(5))); forhandsutfyll(); lagreUtkast();
        S.fane = 'kontroll'; lukkAlle(); render(); scrollTo(0, 0);
        return toast(t('lagretNeste', neste[0].eier, neste.length - 1));
      }
      S.fane = kanEndreNoe() ? 'oversikt' : 'mine'; render(); scrollTo(0, 0);
      apne(() => visSykkel(id));
      if (feil) { apne(() => visKontroll(r.id)); toast(feil + t('provHer'), true); }
      else toast(retter ? t('godkjentToast') : r.status === 'venter' ? t('sendtTilGodkj') : t('lagret'));
    });
  },
  utbedret(el) {
    const id = el.dataset.id, g = gjeldendeKontroll(id); if (!g) return;
    startKontroll(id);
    if (!F || F.sykkel_id !== id) return;
    F.utbedret_for = g.id;
    if (!F.merknad) F.merknad = t('utbedretMerknad', avvikTekst(g).join(', '));
    lagreUtkast(); render();
  },
  async godkjenn(btn) {
    await medKnapp(btn, async () => {
      await api('godkjennKontroll', { id: btn.dataset.id, handling: 'godkjenn' });
      await lastData(); render(); if (LAG.length) LAG[LAG.length - 1](); toast(t('godkjentToast'));
    });
  },
  async avvis(btn) {
    const grunn = prompt(t('avvisGrunn'));
    if (grunn === null) return;
    await medKnapp(btn, async () => {
      await api('godkjennKontroll', { id: btn.dataset.id, handling: 'avvis', grunn });
      await lastData(); render(); tilbake(); toast(t('avvistToast'));
    });
  },
  rettKontroll(btn) {
    const k = S.d.kontroller.find(x => x.id === btn.dataset.id);
    if (!k) return;
    const sk = kSkjema(k);

// ─── RC-bok (the chapter's monthly activity log) ───────────────
// Read: own chapter for everyone; every chapter for RC, president, officer and admin.
// Write: RC/officer of the chapter and admin. Members hand in entries that their RC takes into the book.
let BOK = null, BOKV = null, BOK_IMPORT = null, BOK_P = null;
const kanLeseAlleBoker = () => ['rc', 'president', 'officer', 'admin'].includes(rolle());
function bokStart() {
  const d = new Date();
  BOKV = BOKV || { avd: meg().avdeling, aar: String(d.getFullYear()), mnd: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') };
}
async function lastBok(tving) {
  bokStart();
  if (!tving && BOK && BOK.avdeling === BOKV.avd && BOK.aar === BOKV.aar && BOK._forslag === BOKV.mnd) return BOK;
  const d = await api('rcBok', { avdeling: BOKV.avd, aar: BOKV.aar, forslag: BOKV.mnd });
  d._forslag = BOKV.mnd;
  BOK = d; return d;
}
const bokUkedag = ds => { const d = new Date(ds + 'T12:00'); return d.toLocaleDateString(LANG === 'en' ? 'en-GB' : 'nb-NO', { weekday: 'long' }); };
const stor = s => s.charAt(0).toUpperCase() + s.slice(1);
const bokNar = p => p.nar || `${stor(bokUkedag(p.dato))} ${Number(p.dato.slice(8))}. ${mndNavn(Number(p.dato.slice(5, 7)))}`;
/** Plain text with light markup: blank line = new paragraph, "- " = list item, "### " = subheading. */
function bokTekst(s) {
  const ut = []; let liste = [], avsnitt = [];
  const tomAvsnitt = () => { if (avsnitt.length) ut.push(`<p>${avsnitt.map(esc).join('<br>')}</p>`); avsnitt = []; };
  const tomListe = () => { if (liste.length) ut.push(`<ul>${liste.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`); liste = []; };
  String(s || '').split(/\r?\n/).forEach(l => {
    const r = l.trim();
    if (/^[-•*]\s+/.test(r)) { tomAvsnitt(); liste.push(r.replace(/^[-•*]\s+/, '')); return; }
    tomListe();
    if (!r) return tomAvsnitt();
    if (/^#{1,4}\s+/.test(r)) { tomAvsnitt(); ut.push(`<h4>${esc(r.replace(/^#+\s+/, ''))}</h4>`); return; }
    avsnitt.push(r);
  });
  tomListe(); tomAvsnitt();
  return ut.join('');
}
const bokPosterMnd = mnd => (BOK ? BOK.poster.filter(p => p.maaned === mnd) : []).map((p, i) => [p, i]).sort((a, c) => a[0].dato.localeCompare(c[0].dato) || a[1] - c[1]).map(x => x[0]);

    await medKnapp(el, async () => { await api('lagreRcBokMnd', { avdeling: BOKV.avd, maaned: BOKV.mnd, levert: lever }); await lastBok(true); visRcBok(); toast(t(lever ? 'bokLevertOk' : 'bokApnet')); });
  },
  async bokImportLagre(el) {
    const d = BOK_IMPORT; if (!d) return;
    await medKnapp(el, async () => {
      const r = await api('importerRcBok', { avdeling: BOKV.avd, maaneder: d.mnder });
      BOK_IMPORT = null; if (d.mnder.length) { BOKV.aar = d.mnder[0].maaned.slice(0, 4); BOKV.mnd = d.mnder[d.mnder.length - 1].maaned; }
      await lastBok(true); tilbake(); toast(t('bokImportOk', r.poster, r.maaneder));
    });
  },
  bokSkrivUt(el) { medKnapp(el, async () => { await lastBok(); await bokSkrivUt(); }); }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.matches('[data-bok-avd]')) { BOKV.avd = el.value; return visRcBok(); }
  if (el.matches('[data-bok-import]') && el.files[0]) {
    const fil = el.files[0]; el.value = '';
    try {
      const mnder = await lesWord(fil);
      if (!mnder.length) return toast(t('bokImportIngen'), true);
      BOK_IMPORT = { navn: fil.name, mnder }; apne(visBokImport);
    } catch (e) { toast(e.message || t('bokIkkeWord'), true); }
  }
});

// ─── Start ──────────────────────────────────────────────────
(async function start() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'no';
  document.title = t('app');
  if (API_URL.indexOf('http') !== 0) { $('#app').innerHTML = `<main><div class="banner v1">${t('apiMangler')}</div></main>`; return; }
  if (!S.token) return visLogin('login');
  try { await lastData(); render(); }
  catch (e) {
    if (e.kode === 'BYTT') return;
    if (S.token) {
      $('#app').innerHTML = `<main class="login"><div class="banner v1">${esc(e.message)}</div><button class="primar bred" onclick="location.reload()">${t('provIgjen')}</button><button class="bred" data-a="loggUt">${t('loggUt')}</button></main>`;
    }
  }
})();
</script>
</body>
