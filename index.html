<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RC Portal">
<title>RC Portal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#111316;--kort:#1b1e23;--kort2:#252930;--linje:#323741;--tekst:#eceef1;--dempet:#98a1ac;
  --aksent:#ffa326;--klubb:#a6192e;--aksent-t:#1a1300;--s0:#2e9e4f;--s1:#d6a915;--s2:#d43a3a;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tekst);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.uten-nav{padding-bottom:0}
header.topp{position:sticky;top:0;z-index:5;background:rgba(17,19,22,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:3px solid var(--klubb);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.topp h1{font-size:17px;margin:0;font-weight:700}
.topp .hvem{margin-left:auto;font-size:12.5px;color:var(--dempet);text-align:right;line-height:1.25}
button.hvem{background:none;border:0;padding:4px 0 4px 8px;min-height:0;font:inherit;font-size:12.5px;display:flex;align-items:center;gap:8px;color:var(--dempet);font-weight:400}
button.hvem svg{width:26px;height:26px;flex:none;color:var(--tekst)}
button.hvem.aktiv svg{color:var(--aksent)}
button.tlfknapp{background:none;border:1.5px solid var(--kant,#2b3038);border-radius:50%;width:38px;height:38px;min-height:0;padding:0;display:grid;place-items:center;flex:none;color:var(--aksent)}
button.tlfknapp svg{width:19px;height:19px}
.tlfsok{margin-bottom:12px}
.tlffilter{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}.tlffilter select{flex:1;min-width:0}
.tlfstill{flex:1;min-width:0;position:relative}
.tlfstill summary{list-style:none;cursor:pointer;background:#0c0e11;border:1px solid var(--linje);border-radius:10px;padding:11px 30px 11px 12px;min-height:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.tlfstill summary::-webkit-details-marker{display:none}
.tlfstill summary::after{content:'';position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--dempet);border-bottom:2px solid var(--dempet);transform:translateY(-70%) rotate(45deg)}
.tlfstill[open] summary{border-color:var(--aksent)}
.tlffa .tlfstillvalg{left:0;right:-40%}
.tlfstillvalg{position:absolute;right:0;left:-40%;top:calc(100% + 4px);z-index:20;background:var(--kort2);border:1px solid var(--linje);border-radius:10px;padding:8px 12px;max-height:60vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tlfstillvalg label{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linje)}
.tlfstillvalg input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--aksent);flex:none}
.tlfstillvalg button.vkort{background:none;border:0;padding:2px 0 8px;color:var(--aksent);font-size:14px;text-decoration:underline;cursor:pointer}
.klubbtittel{margin:4px 0 14px;text-align:center}.klubbtittel img{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
.sokrad{display:flex;gap:8px;margin:0 0 12px}
.sokrad input[type=search]{flex:1;min-width:0}
.skannknapp{flex:none;width:50px;display:grid;place-items:center;border-radius:12px;background:var(--aksent);color:#1a1300;cursor:pointer}
.skannknapp svg{width:24px;height:24px}
.kalrad{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--kant,#2b3038);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;min-height:0;font:inherit;color:inherit}
.kalrad:first-of-type{border-top:0}
.kaldato{flex:none;width:52px;text-align:center;border-radius:12px;background:#1b1e23;border:1.5px solid var(--klubb);padding:6px 0 5px;line-height:1}
.kaldato b{display:block;font-size:22px;font-weight:800}
.kaldato small{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--aksent);margin-top:3px}
.kalinfo{flex:1;min-width:0}
.kalinfo b{display:block;font-weight:650;line-height:1.3}
.kalinfo .dempet{font-size:13px;margin-top:2px}
.kaltag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1a1300;background:var(--aksent);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.kalknapp{display:flex;align-items:center;justify-content:center;gap:8px}
.kalknapp svg{width:19px;height:19px;flex:none}
.kalsted a{color:var(--aksent)}
.kalfilter{border:0;padding:0;margin:8px 0 12px;min-width:0}
.kalfilter legend{font-size:13px;font-weight:650;color:var(--dempet);padding:0;margin-bottom:6px}
.kalvalg{display:flex;flex-wrap:wrap;gap:6px}
.kalvalg label{display:flex;align-items:center;gap:7px;margin:0;padding:8px 10px;min-height:44px;max-width:100%;background:var(--kort2);border:1px solid var(--linje);border-radius:8px;font-size:13px;cursor:pointer;overflow-wrap:anywhere}
.kalvalg input[type=checkbox]{width:19px;height:19px;min-height:19px;flex:none;margin:0;padding:0;accent-color:var(--aksent)}
.kalvalg label:has(input:checked){border-color:var(--aksent)}
.kalvalg label:focus-within{outline:2px solid var(--aksent);outline-offset:2px}
.svarknapper{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.svarknapper button{min-height:52px;font-weight:700;border:2px solid transparent}
.svarknapper .ja{background:rgba(52,168,83,.15);color:#7fd99a;border-color:rgba(52,168,83,.5)}
.svarknapper .kanskje{background:rgba(234,179,8,.14);color:#f3cf5a;border-color:rgba(234,179,8,.5)}
.svarknapper .nei{background:rgba(220,60,60,.14);color:#f08a8a;border-color:rgba(220,60,60,.5)}
.svarknapper .valgt.ja{background:#2f9e55;color:#fff;border-color:#2f9e55}
.svarknapper .valgt.kanskje{background:#e0b011;color:#1a1300;border-color:#e0b011}
.svarknapper .valgt.nei{background:#d64545;color:#fff;border-color:#d64545}
.svartall{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--dempet);margin-top:4px}
.svartall i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:0}
.svartall .mitt{font-weight:700;color:var(--tekst)}
.kalmerke{display:inline-flex;align-items:center;gap:5px;max-width:100%;margin-top:6px;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:650;line-height:1.4;background:rgba(120,140,255,.12);color:#aab6ff;border:1px dashed rgba(120,140,255,.5)}
.kalmittsvar{display:inline-flex;align-items:center;gap:5px;max-width:100%;margin-top:6px;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:650;line-height:1.4;background:#252930;color:var(--dempet);border:1px solid var(--linje)}
.kalmittsvar.ja{background:rgba(52,168,83,.15);color:#7fd99a;border-color:rgba(52,168,83,.5)}
.kalmittsvar.kanskje{background:rgba(234,179,8,.14);color:#f3cf5a;border-color:rgba(234,179,8,.5)}
.kalmittsvar.nei{background:rgba(220,60,60,.14);color:#f08a8a;border-color:rgba(220,60,60,.5)}
.svarliste h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.svarliste p{margin:0;font-size:14px}
.kalbesk{white-space:pre-wrap;font-size:13.5px;color:var(--dempet);margin:8px 0 0}
.tlfavd h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tlfadr{font-size:13.5px;color:var(--dempet);margin:-4px 0 8px;line-height:1.4}
.tlfadr a{color:var(--aksent)}
.tlfrad{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--kant,#2b3038)}
.tlfrad:first-of-type{border-top:0}
.tlfrad .hvem2{flex:1;min-width:0}
.tlfrad .hvem2 b{display:block;font-weight:600}
.tlfrad .hvem2 small{color:var(--dempet);font-size:12.5px}
.tlfrad a.ring{display:inline-flex;align-items:center;gap:6px;color:var(--aksent);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px}
.tlfrad a.ring svg{width:16px;height:16px}
.tlfvalg{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tlfrad .hvem2 a.epost{display:block;color:var(--aksent);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlfrad .hvem2 small{display:block}
.tlfrad .hvem2 button.vkort{display:block}
.tlfrad .hvem2 button.vkort,.tlfavd h3 button.vkort{background:none;border:0;padding:0;margin-top:4px;color:var(--dempet);font-size:12.5px;text-decoration:underline;cursor:pointer}
.tlfavd h3 button.vkort{margin:0;font-weight:500}
.tlfrad a.signal{background:#3a76f0;color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:650;text-decoration:none}
/* handbook */
.hbgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.hbkort{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;background:var(--kort);border:1px solid var(--linje);border-radius:var(--r);min-height:0;font:inherit;color:var(--tekst);align-items:stretch}
.hbkort .hbbilde{aspect-ratio:3/2;background:#0c0e11 center/cover no-repeat;display:grid;place-items:center;color:#4b525c}
.hbkort .hbbilde svg{width:34px;height:34px}
.hbkort .hbtekst{padding:8px 10px 10px;font-weight:700;font-size:14.5px;line-height:1.2}
.hbkort .merke{margin-top:5px;font-size:10px}
.hbstor{width:100%;border-radius:10px;display:block;margin-bottom:12px;background:#0c0e11}
.hbseksjon h4{color:var(--aksent);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.hbseksjon p{margin:0 0 8px;line-height:1.5}
.hbseksjon ul,.hbseksjon ol{margin:4px 0 10px;padding-left:22px;line-height:1.5}
.hbseksjon li{margin-bottom:5px}
.hbmangler{text-align:center;color:var(--dempet);padding:26px 14px;aspect-ratio:3/2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.hbmangler svg{width:44px;height:44px}
.hbbildetekst{font-size:13px;color:var(--dempet);text-align:center;margin:-6px 0 12px;font-style:italic}
.topp .tilbake{min-height:36px;padding:6px 12px;font-size:15px}
main{max-width:760px;margin:0 auto;padding:16px}
nav.bunn{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#16191d;border-top:1px solid var(--linje);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bunn button{flex:1;background:none;border:0;border-radius:0;color:var(--dempet);padding:9px 2px 8px;font:600 11.5px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
nav.bunn svg{width:23px;height:23px}
nav.bunn button.aktiv{color:var(--aksent)}
h2{font-size:21px;margin:2px 0 14px;line-height:1.2}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dempet);margin:22px 0 8px;font-weight:700}
.kort h3:first-child{margin-top:0}
p{margin:0 0 10px}
.dempet{color:var(--dempet);font-size:14px}
.tom{color:var(--dempet);font-style:italic}
.kort{display:block;width:100%;text-align:left;background:var(--kort);border:1px solid var(--linje);border-radius:var(--r);padding:14px;margin:0 0 10px;color:var(--tekst);font:inherit}
button.kort{cursor:pointer}
button.kort:active{background:var(--kort2)}
button,.knapp{font:600 15px system-ui;border-radius:10px;border:1px solid var(--linje);background:var(--kort2);color:var(--tekst);padding:11px 14px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:disabled{opacity:.55;cursor:default}
.primar{background:var(--aksent);color:var(--aksent-t);border-color:var(--aksent)}
.fare{background:transparent;color:#ff8d8d;border-color:#6b2e2e}
.bred{width:100%;margin-bottom:10px}
.knapperad{display:flex;gap:8px;flex-wrap:wrap}
.knapperad>*{flex:1}
input,select,textarea{width:100%;font:16px system-ui;color:var(--tekst);background:#0c0e11;border:1px solid var(--linje);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--aksent);outline-offset:-1px}
input[readonly]{opacity:.7}
label.felt{display:block;margin-bottom:12px}
label.felt>span,.felt-tittel{display:block;font-size:13px;color:var(--dempet);margin-bottom:5px}
.rad2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sjekk{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:600}
.sjekk input{width:24px;height:24px;min-height:0;accent-color:var(--aksent)}
.linje1{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* scale */
.punkt{padding:12px 0;border-top:1px solid var(--linje)}
.punkt:first-of-type{border-top:0;padding-top:4px}
.punkt .pnavn{font-weight:650;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.punkt.mangler .pnavn::after{content:attr(data-mangler);color:#ff9b54;font-size:12px;font-weight:700}
.skala{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.skala button{padding:8px 2px;font-size:14px;min-height:48px;line-height:1.1}
.skala button.valgt[data-v="0"]{background:var(--s0);border-color:var(--s0);color:#fff}
.skala button.valgt[data-v="1"]{background:var(--s1);border-color:var(--s1);color:#1a1400}
.skala button.valgt[data-v="2"]{background:var(--s2);border-color:var(--s2);color:#fff}
.ekstra{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ekstra input{min-height:42px;padding:9px 10px;font-size:15px}
.valg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.valg2 button{min-height:42px;padding:8px}
.valg2 button.valgt{background:var(--s0);border-color:var(--s0);color:#fff}
.valg2 button.valgt.neg{background:var(--s2);border-color:var(--s2)}
.valg2.noy button.valgt{background:#3c4452;border-color:#566070}
.oljerad{display:grid;grid-template-columns:1fr 1.1fr 1.6fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--linje)}
.oljerad:first-of-type{border-top:0}
.oljerad input{min-height:42px;padding:8px 10px;font-size:15px}
.oljerad b{font-weight:650;font-size:15px}
.banner{border-radius:10px;padding:12px 14px;font-weight:650;margin-bottom:12px;background:var(--kort2)}
.banner.v0{background:rgba(46,158,79,.16);color:#7fe39c;border:1px solid rgba(46,158,79,.4)}
.banner.v1{background:rgba(214,169,21,.14);color:#f1d062;border:1px solid rgba(214,169,21,.4)}
.banner.v2{background:rgba(212,58,58,.18);color:#ff9a9a;border:1px solid rgba(212,58,58,.55)}
.banner.info{background:rgba(70,120,200,.14);color:#a9c6f5;border:1px solid rgba(70,120,200,.4);font-weight:550}
/* chips & badges */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--kort2);color:var(--dempet);white-space:nowrap}
.chip.v0{background:rgba(46,158,79,.2);color:#7fe39c}
.chip.v1{background:rgba(214,169,21,.2);color:#f1d062}
.chip.v2{background:rgba(212,58,58,.28);color:#ffa3a3}
.merke{display:inline-block;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--s2);color:#fff;letter-spacing:.05em;white-space:nowrap}
.merke.gul{background:var(--s1);color:#1a1400}
.merke.gra{background:#3a414c;color:#d5dae0}
.merke.bla{background:#2d5b9a;color:#fff}
.status{font-size:13.5px;color:var(--dempet);margin-top:8px}
.rodt{color:#ff8d8d;font-weight:650}
.oransje{color:#ffab6b;font-weight:650}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat button{flex-direction:column;gap:0;padding:10px 4px;min-height:66px;background:var(--kort);font-weight:600}
.stat b{font-size:22px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--dempet)}
.stat button.aktiv{border-color:var(--aksent);box-shadow:inset 0 0 0 1px var(--aksent)}
.forklaring{font-size:12.5px;color:var(--dempet);margin:-4px 0 14px;display:flex;gap:10px;flex-wrap:wrap}
.forklaring i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dl.info dt{color:var(--dempet);font-size:14px}
dl.info dd{margin:0;font-weight:600;text-align:right}
.kodeboks{background:#0c0e11;border:1px dashed var(--aksent);border-radius:12px;padding:14px;text-align:center;margin:10px 0}
.kodeboks b{font-size:32px;letter-spacing:.18em;color:var(--aksent);display:block;font-variant-numeric:tabular-nums}
/* login */
.login{max-width:420px;padding-top:calc(48px + env(safe-area-inset-top))}
.ordmerke{height:46px;width:auto;display:block;margin:0 auto}
.ordmerke-topp{height:24px;width:auto;display:block}
.logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
div.logo{width:64px;height:64px;border-radius:16px;background:var(--aksent);color:var(--aksent-t);display:grid;place-items:center}
.logo svg{width:40px;height:40px}
.login h1{text-align:center;font-size:24px;margin:0 0 4px}
.login .under{text-align:center;color:var(--dempet);margin-bottom:22px}
.faner2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.faner2 button.aktiv{border-color:var(--aksent);color:var(--aksent)}
.hint{text-align:center;color:var(--dempet);font-size:14px;margin-top:12px}
/* overlay & toast */
#lag{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#lag main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;transition:opacity .2s,transform .2s;
  background:#f1f2f4;color:#111;padding:11px 16px;border-radius:10px;font-weight:650;z-index:40;max-width:calc(100vw - 32px);pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast.vis{opacity:1;transform:translate(-50%,0)}
#toast.feil{background:var(--s2);color:#fff}
.laster{display:grid;place-items:center;min-height:60vh;color:var(--dempet)}
.spinn{width:28px;height:28px;border:3px solid var(--linje);border-top-color:var(--aksent);border-radius:50%;animation:spinn .8s linear infinite;margin:0 auto 10px}
@keyframes spinn{to{transform:rotate(360deg)}}
/* photos */
.bildeknapper{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bildeknapper .knapp.krav{border-color:var(--aksent);color:var(--aksent)}
.bildeknapper .knapp{flex:1 1 0;flex-direction:column;gap:4px;font-size:13.5px;padding:9px 4px;min-width:0;min-height:62px;text-align:center;line-height:1.15}
.bildeknapper svg{width:22px;height:22px;flex:none}
.bilderad{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.tommel{position:relative;padding:0;border-radius:10px;overflow:hidden;border:1px solid var(--linje);background:#0c0e11;aspect-ratio:1/1;display:block;min-height:0;width:100%}
.tommel img{width:100%;height:100%;object-fit:cover;display:block}
.tommel span{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:700;padding:3px 6px;background:rgba(0,0,0,.66);color:#fff;text-align:left}
.tommel .fjern{position:absolute;top:4px;right:4px;width:30px;height:30px;min-height:0;padding:0;border-radius:50%;background:rgba(0,0,0,.72);border:0;color:#fff;font-size:19px;line-height:1}
img.stor{width:100%;border-radius:10px;display:block;background:#0c0e11;min-height:220px}
/* profile & bike photos */
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#0c0e11 center/cover;flex:none;border:2px solid var(--aksent);display:grid;place-items:center;color:#4b525c;overflow:hidden}
.avatar svg{width:38px;height:38px}
.avatar-liten{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid var(--aksent)}
.profiltopp{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.profiltopp .navn{font-weight:700;font-size:17px}
.mcmini{width:44px;height:30px;border-radius:6px;object-fit:cover;margin-right:8px;vertical-align:middle;flex:none}
.mcbilde{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:#0c0e11;margin-bottom:10px}
.lenkeknapp.fil{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.lenkeknapp.fil svg{width:18px;height:18px}
/* install */
.install{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;border-color:var(--aksent);background:linear-gradient(135deg,rgba(255,163,38,.13),var(--kort) 60%)}
.install p{margin:0;font-weight:600}
.install .knapperad button{min-height:40px}
ol.steg{padding-left:22px;margin:0 0 12px;line-height:1.5}
ol.steg li{margin-bottom:10px}
ol.steg svg{width:20px;height:20px;vertical-align:-4px;color:var(--aksent)}
/* follow-up, stats, feedback */
.bunnlenke{text-align:center;margin:26px 0 6px;font-size:14px}
.bunnlenke a{color:var(--dempet)}
.ofrad{display:flex;align-items:center;gap:10px}
.ofrad .ofinfo{flex:1;min-width:0}
.ofrad .knapp{min-height:38px;padding:6px 14px;flex:none}
.knapp.sendt{border-color:var(--s0);color:#7fe39c}
.sesong.pst span{font-size:11px;font-weight:700}
.statavd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
details.kort summary{cursor:pointer;font-weight:650;list-style:none}
details.kort summary::-webkit-details-marker{display:none}
details.kort summary::after{content:'▾';float:right;color:var(--dempet)}
details.kort[open] summary{margin-bottom:10px}
details.kort p{font-size:14.5px;color:#cfd3d9}
/* wolfpack */
.wpmerke{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.wpmerke.red{background:#a6192e;color:#fff}.wpmerke.black{background:#000;color:#fff;box-shadow:inset 0 0 0 1px #555}
.wpmerke.gold{background:#ffa326;color:#1a1300}.wpmerke.platina{background:linear-gradient(135deg,#f4f6f8,#b9c0c8);color:#1b1e23}
.wpnivaa{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.wpnivaa span{font-size:12px}
.wp{display:flex;flex-direction:column;gap:8px}
.wprad{display:flex;gap:10px;align-items:center;background:var(--kort);border:1px solid var(--linje);border-radius:var(--r);padding:10px 12px}
.wprad.forst{border-color:var(--aksent);box-shadow:inset 0 0 0 1px var(--aksent)}
.wpnr{width:30px;flex:none;text-align:center;font-weight:800;font-size:18px;color:var(--dempet);font-variant-numeric:tabular-nums}
.wpinfo{flex:1;min-width:0}
.wpkm{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.wpbar{height:12px;border-radius:6px;background:#0c0e11;margin:6px 0 4px;overflow:hidden}
.wpbar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#c4730f,var(--aksent))}
.wprad.forst .wpbar span{background:linear-gradient(90deg,var(--aksent),#ffc46e)}
/* season strip */
.sesong{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.sesong span{display:flex;align-items:center;justify-content:center;height:28px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.01em;background:#20242a;color:#6d7682;border:1px solid transparent}
.sesong span.v0{background:var(--s0);color:#fff}
.sesong span.v1{background:var(--s1);color:#1a1400}
.sesong span.v2{background:var(--s2);color:#fff}
.sesong span.mangler{border:1px dashed #b4652e;color:#ffab6b;background:transparent}
.sesong span.na{box-shadow:0 0 0 2px var(--aksent)}
.sesong span.fremtid{opacity:.4}
.skjemavalg{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.lenkeknapp{background:none;border:0;color:var(--aksent);padding:4px 0;min-height:0;font-weight:600;font-size:14px;text-decoration:underline}
.sprak{display:flex;gap:6px;justify-content:center;margin-top:18px}
.sprak button{min-height:36px;padding:6px 14px;font-size:14px}
.sprak button.aktiv{border-color:var(--aksent);color:var(--aksent)}
@media (min-width:600px){.stat span{font-size:12.5px}}
.kmbyttet{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--dempet);margin:-4px 0 10px}.kmbyttet input{width:auto;min-height:0}
.forrigeinfo{background:#1f1a10;border-left:3px solid var(--aksent);border-radius:0 8px 8px 0;padding:8px 10px;margin:-4px 0 12px;font-size:14px;line-height:1.4}
.bokknapp{display:flex;align-items:center;gap:12px;cursor:pointer}
.bokknapp svg{width:26px;height:26px;color:var(--aksent);flex:none}
.bokknapp span:first-of-type{flex:1;display:flex;flex-direction:column}
.bokknapp small{color:var(--dempet);font-size:13px}
.bokknapp .pil{font-size:24px;color:var(--dempet)}
.bokvelg{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.bokvelg select{width:auto;flex:1;max-width:60%}
.aarvelg{display:flex;align-items:center;gap:6px}
.aarvelg button{min-height:40px;width:40px;padding:0;font-size:20px}
.bokmnder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.bokmnder button{min-height:44px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;line-height:1.15}
.bokmnder button small{font-size:11px;color:var(--dempet)}
.bokmnder button.aktiv{background:var(--aksent);color:#111;border-color:var(--aksent)}
.bokmnder button.aktiv small{color:#111}
.bokmnder button.fremtid{opacity:.55}
.bokside h2{margin:4px 0 2px}
.bokstatus{margin:0 0 12px;font-size:13.5px}
.bokinnl{font-style:italic;color:var(--dempet)}
.bokpost{border-top:1px solid var(--linje);padding:12px 0 6px}
.bokpost h3{margin:0 0 6px;font-size:16px;line-height:1.3;text-transform:none;letter-spacing:0;color:var(--tekst)}
.bokpost p,.bokside>p,.bokinnl p{margin:0 0 8px;line-height:1.5}
.bokpost ul{margin:0 0 8px;padding-left:20px}
.bokpost h4{margin:10px 0 4px}
.bokpost.innlevert{border-left:3px solid #e0a020;padding-left:10px}
.bokav{font-size:12.5px;color:var(--dempet);margin:-2px 0 6px}
.bokmerke{display:inline-block;font-size:12px;background:#4a3a10;color:#f3cf6a;border-radius:999px;padding:2px 9px;margin-bottom:6px}
.bokvalg{margin:2px 0 4px;justify-content:flex-end;align-items:center}.bokvalg button{min-height:36px;font-size:14px;padding:6px 14px}.bokvalg .lenkeknapp{padding:4px 2px}
.bokoppsum{margin:16px 0 6px}
.bokforslag{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linje)}
.bokforslag div{flex:1;min-width:0}.bokforslag b{display:block}.bokforslag small{color:var(--dempet);font-size:12.5px}
.bokforslag button{min-height:38px;font-size:14px;flex:none}
.bokimprad{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--linje)}
.bokimprad span{color:var(--dempet)}
#utskrift{display:none}
@media print{nav.bunn,header.topp,#toast{display:none}body{background:#fff;color:#000}
  body.skriver>*:not(#utskrift){display:none!important}
  body.skriver #utskrift{display:block;font:11pt/1.45 Georgia,serif;color:#000}
  #utskrift h1{font-size:20pt}#utskrift h2{font-size:16pt;margin-top:22pt;page-break-before:always}#utskrift section:first-of-type h2{page-break-before:auto}
  #utskrift h3{text-transform:none;letter-spacing:0;color:#000;font-weight:700;font-size:12pt;margin:12pt 0 3pt;page-break-after:avoid}#utskrift article{page-break-inside:auto}
  #utskrift figure{display:inline-block;margin:4pt 6pt 4pt 0;max-width:48%;vertical-align:top}#utskrift img{max-width:100%;max-height:7cm}#utskrift figcaption{font-size:9pt}}

async function api(action, data) {
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.token, lang: LANG }, data || {})) });
  } catch (e) { throw new Error(t('ingenKontakt')); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error(t('uventet', res.status)); }
  if (!j.ok) {
    if (j.kode === 'AUTH' && action !== 'login' && action !== 'aktiver') loggUt(j.feil);
    if (j.kode === 'BYTT') visTvungen();
    const e = new Error(j.feil || t('ukjentFeil')); e.kode = j.kode; throw e;

  return j.data;
}

const BILDECACHE = {};
const bilderFor = (refType, refId) => (S.d.bilder || []).filter(b => b.ref_type === refType && String(b.ref_id) === String(refId));
const alderTimer = ts => (Date.now() - new Date(String(ts).replace(' ', 'T')).getTime()) / 3600e3;

/** Scale down on the phone before upload: max 1600 px, JPEG 80 %, typically 200–400 kB. */
function lesBilde(fil, maks = 1600) {
  return new Promise((ok, avvis) => {
    const url = URL.createObjectURL(fil);
    const img = new Image();
    img.onload = () => {
      const f = Math.min(1, maks / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); avvis(new Error(t('kunneIkkeLese', fil.name))); };
    img.src = url;
  });
}

function kanLeggeTilBilde(refType, ref) {

async function lastOppBilder(liste, refType, refId, btn) {
  let feil = 0, melding = '';
  for (let i = 0; i < liste.length; i++) {
    if (btn) btn.innerHTML = t('lasterOppAv', i + 1, liste.length);
    try { await api('lastOppBilde', { ref_type: refType, ref_id: refId, type: liste[i].type, data: liste[i].data, kommentar: liste[i].kommentar || '' }); }
    catch (e) { feil++; melding = e.message; }
  }
  return feil ? t('bildeFeil', feil, liste.length, melding) : '';
}
async function velgBilder(el) {
  const filer = Array.from(el.files || []);
  el.value = '';
  if (!filer.length) return;
  const type = el.dataset.bilde;
  let data;
  const maks = type === 'profil' ? 500 : type === 'sykkel' ? 1400 : 1600;
  try { data = await Promise.all(filer.map(f => lesBilde(f, maks))); } catch (e) { return toast(e.message, true); }
  const nye = data.map(d => ({ type, data: d }));
  if (el.dataset.direkte) {
    const [refType, refId] = el.dataset.direkte.split(':');
    toast(nye.length > 1 ? t('lasterOppFlere', nye.length) : t('lasterOpp1'));
    const feil = await lastOppBilder(nye, refType, refId);
    try { await lastData(); if (refType === 'rcbok') await lastBok(true); } catch (e) { /* toast below */ }
    render(); if (LAG.length) LAG[LAG.length - 1]();
    return toast(feil || t('bildeLagret'), !!feil);
  }
  const sk = skjemaFor(el);
  if (!sk || !sk.obj) return;
  sk.obj.bilder = (sk.obj.bilder || []).concat(nye);
  if (sk.navn === 'K') { if (type === 'avis') F.bilde_avis = 'Ja'; lagreUtkast(); render(); }
  else visEgenSkjema();
}

  </main>`;

}

function faner() {

// overlay stack
const LAG = [];
function apne(fn) { LAG.push(fn); fn(); }
function tilbake() { LAG.pop(); if (LAG.length) LAG[LAG.length - 1](); else lukkAlle(); }
function lukkAlle() { LAG.length = 0; const l = $('#lag'); l.hidden = true; l.innerHTML = ''; document.body.style.overflow = ''; }
function tegnLag(tittel, html) {
  const l = $('#lag');

/** Odometer per year: first and last reading (inspections + self-declarations). 0 / empty = not read. */
function kmLogg(sykkelId) {
  const m = [...S.d.kontroller, ...S.d.egenerklaeringer]
    .filter(x => x.sykkel_id === sykkelId && Number(x.km) > 0)
    .map(x => ({ dato: String(x.dato).slice(0, 10), km: Number(x.km) }))
    .sort((a, b) => a.dato.localeCompare(b.dato));
  const aar = {};
  m.forEach(x => { const y = x.dato.slice(0, 4); (aar[y] = aar[y] || []).push(x); });
  return Object.keys(aar).sort().reverse().map(y => ({ aar: y, start: aar[y][0], slutt: aar[y][aar[y].length - 1], n: aar[y].length }));
}
const kmNr = v => Number(v).toLocaleString(LANG === 'en' ? 'en-GB' : 'nb-NO');
function kmLinjer(sykkelId) {
  const l = kmLogg(sykkelId);
  if (!l.length) return `<span class="tom">${t('kmIngen')}</span>`;
  return l.map(x => x.n > 1 && x.slutt.km >= x.start.km
    ? esc(t('kmAar', x.aar, kmNr(x.start.km), kmNr(x.slutt.km) + ' km', kmNr(x.slutt.km - x.start.km) + ' km'))
    : esc(t('kmEn', x.aar, kmNr(x.slutt.km) + ' km'))).join('<br>');
}

  kontrollerFor(sykkelId).forEach(k => [...VIDEREFOR, ...HINT].forEach(f => { if (tom(ut[f]) && !tom(k[f])) ut[f] = String(k[f]); }));
  return ut;

/** Fill carried-over fields that are still empty; remembers which ones so a bike change can undo them. */
function forhandsutfyll() {
  if (!F) return;
  (F._forhand || []).forEach(f => { if (F[f] === F._forhandVerdi[f]) delete F[f]; });
  F._forhand = []; F._forhandVerdi = {};

  const fv = forrigeVerdier(F.sykkel_id);
  VIDEREFOR.forEach(f => { if (tom(F[f]) && !tom(fv[f])) { F[f] = fv[f]; F._forhand.push(f); F._forhandVerdi[f] = fv[f]; } });

/** Four user-selected corners, clockwise from top left; all processing stays on the phone. */
async function markerSkilt(img) {
  return new Promise(resolve => {
    const en = document.documentElement.lang === 'en';
    const dialog = document.createElement('dialog');
    dialog.style.cssText = 'width:min(94vw,620px);max-height:94dvh;overflow:auto;padding:16px;border:1px solid #777;border-radius:14px;background:#202020;color:white';
    dialog.innerHTML = `<h3 style="margin:0 0 8px">${en ? 'Mark the plate' : 'Marker skiltet'}</h3>
      <p data-hjelp></p><canvas style="display:block;width:100%;touch-action:manipulation;cursor:crosshair"></canvas>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button type="button" data-reset>${en ? 'Start again' : 'Start på nytt'}</button>
      <button type="button" data-read disabled>${en ? 'Read plate' : 'Les skilt'}</button>
      <button type="button" data-cancel>${en ? 'Type instead' : 'Skriv regnr i stedet'}</button></div>`;
    document.body.appendChild(dialog);
    const c = dialog.querySelector('canvas'), g = c.getContext('2d');
    const scale = Math.min(1, 800 / img.naturalWidth, 1000 / img.naturalHeight);
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    const points = [], labels = en ? ['top left', 'top right', 'bottom right', 'bottom left'] : ['øverst til venstre', 'øverst til høyre', 'nederst til høyre', 'nederst til venstre'];
    const read = dialog.querySelector('[data-read]'), help = dialog.querySelector('[data-hjelp]');
    const draw = () => {
      g.drawImage(img, 0, 0, c.width, c.height);
      if (points.length) {
        g.strokeStyle = '#ffcf00'; g.lineWidth = 3; g.beginPath();
        points.forEach((p,i) => i ? g.lineTo(p.x,p.y) : g.moveTo(p.x,p.y));
        if (points.length === 4) g.closePath(); g.stroke();
        points.forEach((p,i) => { g.fillStyle='#ffcf00';g.beginPath();g.arc(p.x,p.y,7,0,Math.PI*2);g.fill();g.fillStyle='#000';g.font='bold 12px sans-serif';g.fillText(String(i+1),p.x-3,p.y+4); });
      }
      read.disabled = points.length !== 4;
      help.textContent = points.length < 4
        ? (en ? 'Tap the plate corner: ' : 'Trykk på skiltets hjørne: ') + labels[points.length]
        : (en ? 'Check the outline, then read the plate.' : 'Sjekk at rammen følger skiltet, og trykk Les skilt.');
    };
    let done = false;
    const finish = value => { if(done)return;done=true;dialog.close();dialog.remove();resolve(value); };
    dialog.addEventListener('cancel',ev => {ev.preventDefault();finish(null);});
    dialog.querySelector('[data-cancel]').onclick = () => finish(null);
    dialog.querySelector('[data-reset]').onclick = () => { points.length=0;draw(); };
    c.onclick = ev => {
      if(points.length===4)return;
      const b=c.getBoundingClientRect();points.push({x:(ev.clientX-b.left)*c.width/b.width,y:(ev.clientY-b.top)*c.height/b.height});draw();
    };
    read.onclick = () => {
      if(points.length!==4)return;
      // Reject crossed/degenerate selections before allocating image buffers.
      const crosses = points.map((p,i) => {const q=points[(i+1)%4],r=points[(i+2)%4];return(q.x-p.x)*(r.y-q.y)-(q.y-p.y)*(r.x-q.x);});

      const p=points.map(v=>({x:v.x/c.width*img.naturalWidth,y:v.y/c.height*img.naturalHeight}));

      const width=(dist(p[0],p[1])+dist(p[3],p[2]))/2, height=(dist(p[0],p[3])+dist(p[1],p[2]))/2;
      const out=document.createElement('canvas');out.width=800;out.height=Math.max(120,Math.min(1000,Math.round(800*height/width)));

async function skannSkilt(fil) {
  let tekster = [], r;
  try {
    const w = await ocrArbeider(); toast(t('skannLeser'));
    const les = async (bilde, psmer) => { for (const psm of psmer) { await w.setParameters({ tessedit_pageseg_mode: psm }); tekster.push((await w.recognize(bilde)).data.text); } };
    const img = await lastBilde(fil), W = img.naturalWidth, H = img.naturalHeight;
    // 1) the white plate itself, found in the photo; 2) the centre (where people aim); 3) the whole picture
    // inside the white plate, without the frame and the blue N band (they confuse the reader), then the plate with a little margin
    const forsok = finnSkilt(img).flatMap(b => { const venstre = b.w / b.h > 2.5 ? 0.09 : 0.17; return [

      () => les(utsnitt(img, b.x + b.w * venstre, b.y + b.h * 0.04, b.w * (0.98 - venstre), b.h * 0.92, 900), ['6', '11']),
      () => les(utsnitt(img, Math.max(0, b.x - b.w * 0.05), Math.max(0, b.y - b.h * 0.05), Math.min(W, b.w * 1.1), Math.min(H, b.h * 1.1), 900), ['11'])]; })
      // foreign plates: rows with letters and digits, using (almost) the full width – not every country has the band on the left
      .concat(finnSkilt(img).slice(0, 2).map(b => () => lesLinjer(w, utsnitt(img, b.x + b.w * 0.03, b.y + b.h * 0.04, b.w * 0.94, b.h * 0.92, 900), tekster, true)))
      .concat([() => les(utsnitt(img, W * 0.08, H * 0.15, W * 0.84, H * 0.7, 1400), ['6', '11']), () => les(utsnitt(img, 0, 0, W, H, 1800), ['11'])])
      // a tilted or sideways photo: the plate is found, but the text is skewed or runs up/down (last resort, biggest plate only)
      .concat(finnSkilt(img).slice(0, 1).flatMap(b => [12, -12, 90, 78, 102, -90, -78, -102].map(gr => () =>
        les(roter(utsnitt(img, Math.max(0, b.x - b.w * 0.03), Math.max(0, b.y - b.h * 0.03), Math.min(W, b.w * 1.06), Math.min(H, b.h * 1.06), 900), gr), ['6']))));
    // Dim, tilted plates at the edge can escape the bright-region detector.

    for (const x of [0, W * 0.45]) {
      const c = utsnitt(img, x, H * 0.3, W * 0.55, H * 0.55, 1200);
      for (const gr of [0, 25, -25, 40, -40]) forsok.push(async () => {
        const v = gr ? roter(c, gr) : c;
        await les(v, ['11']);
        if (gr) await lesLinjer(w, v, tekster);
      });
    }
    for (const f of forsok) { await f(); r = finnSykkelFraTekst(tekster, S.d.sykler); r.kandidater = skiltKandidater(tekster); if (r.sikker) break; }
    if (!r || !r.sikker) {
      const valgt = await markerSkilt(img);
      if (valgt) {
        toast(t('skannLeser'));

        await les(valgt, ['6', '11']);
        await lesLinjer(w, utsnitt(valgt, 0, 0, valgt.width, valgt.height, 800), tekster);

// Display preferences are scoped to the signed-in member. Calendar access remains server-side.
const kalFilterNokkel = () => 'tk_kal_skjult_' + String(meg().telefon || '');
function kalSkjulte() {
  try { const v = JSON.parse(hent(kalFilterNokkel()) || '[]'); return Array.isArray(v) ? v.filter(x => typeof x === 'string') : []; }
  catch (e) { return []; }
}
function kalNavn() {
  if (!KAL) return [];
  const navn = (KAL.kalendere || []).map(k => typeof k === 'string' ? k : k && (k.navn || k.name || k.kalender)).filter(n => typeof n === 'string' && n);
  return [...new Set([...navn, ...KAL.hendelser.map(h => h.kalender).filter(n => typeof n === 'string' && n)])];
}
function kalVelger() {
  const navn = kalNavn(), skjulte = new Set(kalSkjulte());
  if (!navn.length) return '';
  return `<fieldset class="kalfilter"><legend>${esc(t('kalVisKalendere'))}</legend><div class="kalvalg">${navn.map(n => `<label><input type="checkbox" data-kalender-filter="${esc(n)}"${skjulte.has(n) ? '' : ' checked'}><span>${esc(n)}</span></label>`).join('')}</div></fieldset>`;
}
function kalSynlige() {
  const skjulte = new Set(kalSkjulte()), sett = new Set();
  return (KAL ? KAL.hendelser : []).map((h, i) => ({ h, i })).filter(({ h }) => {
    if (skjulte.has(h.kalender)) return false;
    // Keep the event from each calendar: hiding one must not remove a copy in another.
    const k = h.kalender + '|' + h.start + '|' + h.tittel.toLowerCase().trim();
    if (sett.has(k)) return false;
    sett.add(k); return true;
  });
}
const kalTomTekst = () => kalNavn().length && kalNavn().every(n => kalSkjulte().includes(n)) ? t('kalIngenValgt') : t('kalTom');
const kalD = s => new Date(String(s).replace(' ', 'T'));
const kalDag = h => `<div class="kaldato"><b>${kalD(h.start).getDate()}</b><small>${esc(mndKort(kalD(h.start).getMonth() + 1))}</small></div>`;
function kalTid(h) {
  const d0 = kalD(h.start), d1 = kalD(h.slutt);
  const ukedag = d => d.toLocaleDateString(LANG === 'en' ? 'en-GB' : 'nb-NO', { weekday: 'short' });
  const klokke = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const flere = h.start.slice(0, 10) !== h.slutt.slice(0, 10);
  if (h.heldag) return flere ? `${ukedag(d0)} ${d0.getDate()}.–${ukedag(d1)} ${d1.getDate()}. ${mndKort(d1.getMonth() + 1)}` : `${ukedag(d0)} · ${t('kalHeldag')}`;
  return flere ? `${ukedag(d0)} ${klokke(d0)} – ${ukedag(d1)} ${d1.getDate()}. ${klokke(d1)}` : `${ukedag(d0)} ${klokke(d0)}–${klokke(d1)}`;
}
// Anniversaries and birthdays are markers, not events – no attendance answers for them
const kalMarkering = h => h.type === 'bursdag' || /^(jub|bursdag)\|/.test(String(h.id || ''));
const kalMerke = h => `<span class="kalmerke"><span aria-hidden="true">${h.type === 'bursdag' || /^bursdag\|/.test(String(h.id || '')) ? '🎂' : '🎉'}</span>${esc(t('kalMerke'))}</span>`;
const kalFlere = () => KAL && KAL.kalendere.length > 1;
const SVAR_FARGE = { ja: '#2f9e55', kanskje: '#e0b011', nei: '#d64545' };
const kalMittSvar = h => {
  const valg = { ja: ['svarJa', '✓'], kanskje: ['svarKanskje', '?'], nei: ['svarNei', '✕'] };
  const v = Object.prototype.hasOwnProperty.call(valg, h.mittSvar) ? valg[h.mittSvar] : null;
  return `<span class="kalmittsvar${v ? ' ' + h.mittSvar : ''}"><span aria-hidden="true">${v ? v[1] : '○'}</span>${esc(v ? t('kalDittSvar', t(v[0])) : t('kalIkkeSvart'))}</span>`;
};
const svarTall = h => { const s = h.svar || { ja: [], kanskje: [], nei: [] };
  return `<div class="svartall">${['ja', 'kanskje', 'nei'].map(k => `<span class="${h.mittSvar === k ? 'mitt' : ''}"><i style="background:${SVAR_FARGE[k]}"></i>${s[k].length}</span>`).join('')}</div>`; };
const kalRad = (h, i) => `<button type="button" class="kalrad" data-kal="${i}">${kalDag(h)}<div class="kalinfo"><b>${esc(h.tittel)}${kalFlere() ? `<span class="kaltag">${esc(h.kalender)}</span>` : ''}</b>
  <div class="dempet">${esc(kalTid(h))}${h.sted ? ' · ' + esc(h.sted) : ''}</div>${kalMarkering(h) ? kalMerke(h) : kalMittSvar(h) + svarTall(h)}</div></button>`;
async function lastKalender() {
  try {
    if (!KAL) {
      KAL = await (KAL_HENTER = KAL_HENTER || api('kalender'));
    }
  } catch (e) {
    KAL_HENTER = null;
    // show what went wrong instead of hiding the calendar – makes problems after an update visible
    const el = $('#kalNeste'); if (el) el.innerHTML = `<div class="kort"><h3>${t('kalNeste')}</h3><p class="dempet" style="margin:0">${esc(e.message || String(e))}</p></div>`;
    return;
  }
  const el = $('#kalNeste');
  if (!el || !KAL.kalendere.length) return;
  // birthdays only show up here when they are close – otherwise they would push the club's own events out
  const synlige = kalSynlige(), neste = synlige.filter(({ h }) => h.type !== 'bursdag' || h.start.slice(0, 10) <= omDager(3)).slice(0, 3);
  el.innerHTML = `<div class="kort"><h3>${t('kalNeste')}</h3>${kalVelger()}${neste.length ? neste.map(({ h, i }) => kalRad(h, i)).join('') : `<p class="tom" style="margin:0">${esc(kalTomTekst())}</p>`}
    ${KAL.hendelser.length > 3 || KAL.feilet.length ? `<button type="button" class="bred kalknapp" style="margin:10px 0 0" data-a="kalender">${svg(IKON.kal)} ${t('kalAlle')} (${synlige.length})</button>` : ''}</div>`;
}
function visKalender() {
  let mnd = '';
  const html = kalSynlige().map(({ h, i }) => { const m = h.start.slice(0, 7); const ny = m !== mnd; mnd = m;
    return (ny ? `<h3 style="margin:18px 0 4px">${esc(Mnd(Number(m.slice(5))))} ${m.slice(0, 4)}</h3>` : '') + kalRad(h, i); }).join('');
  tegnLag(t('kalTittel'), `${KAL.feilet.length ? `<div class="banner v1">${esc(t('kalFeilet', KAL.feilet.join(', ')))}</div>` : ''}
    <div class="kort">${kalVelger()}${html || `<p class="tom" style="margin:0">${esc(kalTomTekst())}</p>`}</div>`);
}
function visHendelse(i) {
  const h = KAL.hendelser[i]; if (!h) return tilbake();
  tegnLag(h.tittel, `<div class="kort"><div class="kalrad" style="padding-top:0">${kalDag(h)}<div class="kalinfo"><b>${esc(h.tittel)}</b>
      <div class="dempet">${esc(kalTid(h))}</div>${kalFlere() ? `<div class="dempet">${esc(h.kalender)}</div>` : ''}${kalMarkering(h) ? kalMerke(h) : kalMittSvar(h)}</div></div>
    ${h.sted ? `<p class="kalsted" style="margin:10px 0 0">📍 ${esc(h.sted)} · <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.sted)}">${t('visKart')}</a></p>` : ''}
    ${h.beskrivelse ? `<p class="kalbesk">${esc(h.beskrivelse)}</p>` : ''}</div>
    ${kalMarkering(h) ? `<p class="dempet" style="margin:10px 2px">${esc(t('kalMerkeInfo'))}</p>` : `<div class="svarknapper">${['ja', 'kanskje', 'nei'].map(k => `<button type="button" class="${k}${h.mittSvar === k ? ' valgt' : ''}" data-a="svarKal" data-i="${i}" data-svar="${k}">${t({ ja: 'svarJa', kanskje: 'svarKanskje', nei: 'svarNei' }[k])}</button>`).join('')}</div>
    <div class="kort svarliste">${(() => { const s = h.svar || { ja: [], kanskje: [], nei: [] }; const n = s.ja.length + s.kanskje.length + s.nei.length;
      return n ? ['ja', 'kanskje', 'nei'].filter(k => s[k].length).map(k => `<h4 style="color:${SVAR_FARGE[k]}">${t({ ja: 'svarJa', kanskje: 'svarKanskje', nei: 'svarNei' }[k])} (${s[k].length})</h4><p>${s[k].map(esc).join(', ')}</p>`).join('') : `<p class="dempet">${t('svarIngen')}</p>`; })()}</div>`}
    <button type="button" class="bred kalknapp" data-a="kalIcs" data-i="${i}">${svg(IKON.kal)} ${t('kalLeggTil')}</button>`);
}
/** An .ics file for one event, so it can be added to the phone's own calendar. */
function kalIcs(h) {
  const d = s => s.replace(/[-: ]/g, '').slice(0, 8), dt = s => s.replace(/-/g, '').replace(' ', 'T').replace(':', '') + '00';
  const pluss1 = s => { const x = kalD(s.slice(0, 10) + ' 12:00'); x.setDate(x.getDate() + 1); return x.getFullYear() + String(x.getMonth() + 1).padStart(2, '0') + String(x.getDate()).padStart(2, '0'); };
  const esk = v => String(v || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//RC Portal//NO', 'BEGIN:VEVENT', 'UID:' + d(h.start) + '-' + encodeURIComponent(h.tittel).slice(0, 40) + '@rcportal',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
    ...(h.heldag ? ['DTSTART;VALUE=DATE:' + d(h.start), 'DTEND;VALUE=DATE:' + pluss1(h.slutt)] : ['DTSTART;TZID=Europe/Oslo:' + dt(h.start), 'DTEND;TZID=Europe/Oslo:' + dt(h.slutt)]),
    'SUMMARY:' + esk(h.tittel), ...(h.sted ? ['LOCATION:' + esk(h.sted)] : []), ...(h.beskrivelse ? ['DESCRIPTION:' + esk(h.beskrivelse)] : []),
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}

// ─── Phone list (read live from the club's own sheet via the backend) ───
let TLF = null, TLF_SOK = '', TLF_FA = [], TLF_FS = [];
const e164 = n => { const d = String(n).replace(/[^\d+]/g, ''); return d.startsWith('+') ? d : d.startsWith('00') ? '+' + d.slice(2) : d.length === 8 ? '+47' + d : d; };
const telLenke = n => 'tel:' + e164(n);
// Opens a Signal chat with the number (Signal has no direct-call link); tap the call button in Signal from there.
const signalLenke = n => 'https://signal.me/#p/' + e164(n);
// vCard 3.0 – opens as a contact card on iPhone/Android, imports into Contacts/Outlook on a computer
const harKontakt = p => !!p.epost || p.telefon.replace(/\D/g, '').length >= 6;
const vEsc = v => String(v || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\r?\n/g, '\\n');
function vKort(p, avd) {
  const deler = p.navn.trim().split(/\s+/), etter = deler.length > 1 ? deler.pop() : '';
  return ['BEGIN:VCARD', 'VERSION:3.0', `N:${vEsc(etter)};${vEsc(deler.join(' '))};;;`, `FN:${vEsc(p.navn)}`, `ORG:${vEsc('BMC ' + avd)}`,
    p.status ? `TITLE:${vEsc(p.status)}` : '', p.telefon.replace(/\D/g, '').length >= 6 ? `TEL;TYPE=CELL:${e164(p.telefon)}` : '',
    p.epost ? `EMAIL;TYPE=INTERNET:${p.epost}` : '', 'END:VCARD'].filter(Boolean).join('\r\n');
}
function lastNedVcf(filnavn, tekst) {
  const url = URL.createObjectURL(new Blob([tekst + '\r\n'], { type: 'text/vcard;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = filnavn.replace(/[æÆ]/g, 'ae').replace(/[øØ]/g, 'o').replace(/[åÅ]/g, 'aa').normalize('NFD').replace(/[^\w .-]+/g, '').trim() + '.vcf';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const avdNokkel = a => String(a || '').toLowerCase().replace(/[^a-zæøå]/g, '').slice(0, 6);
async function visTelefonliste() {
  if (!TLF) {
    tegnLag(t('telefonliste'), `<p class="dempet">${t('laster')}</p>`);
    try { TLF = await api('telefonliste'); }
    catch (e) { return tegnLag(t('telefonliste'), `<div class="banner v1">${esc(e.message)}</div>`); }
  }
  const egen = avdNokkel(meg().avdeling);
  // National/Nomad always first, then your own chapter, then the rest in the order of the club's list
  const vekt = a => /^national/i.test(a.navn) ? 0 : avdNokkel(a.navn) === egen ? 1 : 2;
  const avd = [...TLF.avdelinger].sort((a, b) => vekt(a) - vekt(b));
  tegnLag(t('telefonliste'), `${KLUBBTITTEL}
    <div class="tlffilter">${tlfVelger('fa', tlfFaTekst(), t('alleAvd'), avd.map(a => a.navn), TLF_FA)}${tlfVelger('fs', tlfStillTekst(), t('tlfAlleStillinger'), tlfStillinger(avd), TLF_FS)}</div>
    <input class="tlfsok" type="search" data-tlfsok placeholder="${esc(t('tlfSok'))}" value="${esc(TLF_SOK)}" autocomplete="off">
    <div id="tlfListe"></div><p class="dempet" style="font-size:12.5px">${esc(t('tlfHentet', fmtAktiv(TLF.hentet)))}</p>
    <button type="button" class="bred" data-a="tlfPdf">${t('tlfPdf')}</button>`);
  const tegn = () => {
    const el = $('#tlfListe'); if (el) el.innerHTML = tlfHtml(avd, TLF_SOK) || `<p class="tom">${t('tlfIngen')}</p>`;
  };
  TLF_AVD = avd;
  lastJsPdf().catch(() => {});
  tegn();
  const inp = $('[data-tlfsok]');
  if (inp) inp.oninput = () => { TLF_SOK = inp.value; tegn(); };
  const koble = (k, sett, tekst) => {
    const oppd = () => { sett($$(`[data-tlf${k}]`).filter(c => c.checked).map(c => c.value)); const el = $(`[data-tlf${k}-tekst]`); if (el) el.textContent = tekst(); tegn(); };
    $$(`[data-tlf${k}]`).forEach(c => { c.onchange = oppd; });
    const nul = $(`[data-tlf${k}-nullstill]`);
    if (nul) nul.onclick = () => { $$(`[data-tlf${k}]`).forEach(c => { c.checked = false; }); oppd(); };
  };
  koble('fa', v => { TLF_FA = v; }, tlfFaTekst);
  koble('fs', v => { TLF_FS = v; }, tlfStillTekst);
  // Close the pickers when tapping outside them (and keep only one open at a time)
  const velgere = $$('.tlfstill');
  velgere.forEach(d => d.addEventListener('toggle', () => { if (d.open) velgere.forEach(o => { if (o !== d) o.open = false; }); }));
  if (velgere.length) document.addEventListener('click', function lukk(e) { if (!velgere[0].isConnected) return document.removeEventListener('click', lukk); velgere.forEach(d => { if (!d.contains(e.target)) d.open = false; }); });
}
// Multi-select picker (checkbox list in a <details> dropdown)
const tlfVelger = (k, tekst, alle, valg, valgt) => `<details class="tlfstill tlf${k}"><summary data-tlf${k}-tekst>${esc(tekst)}</summary><div class="tlfstillvalg">
  <button type="button" class="vkort" data-tlf${k}-nullstill>${esc(alle)}</button>
  ${valg.map(x => `<label><input type="checkbox" data-tlf${k} value="${esc(x)}"${valgt.includes(x) ? ' checked' : ''}><span>${esc(x)}</span></label>`).join('')}</div></details>`;
const tlfFaTekst = () => !TLF_FA.length ? t('alleAvd') : TLF_FA.length <= 2 ? TLF_FA.join(', ') : t('tlfAvdN', TLF_FA.length);
const tlfStillTekst = () => !TLF_FS.length ? t('tlfAlleStillinger') : TLF_FS.length <= 2 ? TLF_FS.join(', ') : t('tlfStillingerN', TLF_FS.length);
const tlfStillinger = avd => [...new Set(avd.flatMap(a => a.personer.map(x => String(x.status || '').trim())).filter(Boolean))];
let TLF_AVD = [];
const KLUBBTITTEL = '<h2 class="klubbtittel"><img src="bandidos-norway.png?v=1" alt="Bandidos MC Norway"></h2>';
function tlfHtml(avd, sok) {
    const q = String(sok || '').trim().toLowerCase();

      return `<div class="kort tlfavd"><h3><span>${esc(a.navn)}</span><button class="vkort" data-a="vcfAvd" data-avd="${ai}">${esc(t('lagreAlle', a.personer.filter(harKontakt).length))}</button></h3>
        ${adr || a.telefon ? `<div class="tlfadr">${adr ? `${t('klubbhus')}: ${esc(adr)} · <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(adr)}">${t('visKart')}</a>` : ''}
          ${a.telefon ? `${adr ? '<br>' : ''}${t('klubbTlf')}: <a href="${esc(telLenke(a.telefon))}">${esc(a.telefon)}</a>` : ''}</div>` : ''}
        ${p.map(x => `<div class="tlfrad"><div class="hvem2"><b>${esc(x.navn)}</b><small>${esc(x.status)}</small>${x.epost ? `<a class="epost" href="mailto:${esc(x.epost)}">${esc(x.epost)}</a>` : ''}${harKontakt(x) ? `<button class="vkort" data-a="vcfPerson" data-avd="${ai}" data-p="${a.personer.indexOf(x)}">${esc(t('lagreKontakt'))}</button>` : ''}</div>
          ${x.telefon.replace(/\D/g, '').length >= 6 ? `<div class="tlfvalg"><a class="signal" href="${esc(signalLenke(x.telefon))}" target="_blank" rel="noopener">Signal</a>
            <a class="ring" href="${esc(telLenke(x.telefon))}" aria-label="${esc(t('ringVanlig'))}">${svg(IKON.telefon)}${esc(x.telefon.replace(/^\(\+47\)\s*/, ''))}</a></div>` : ''}</div>`).join('')}</div>`;
    }).join('');
}

async function lastWolfpack() {
  const aar = S.wpAar || new Date().getFullYear();
  try {
    if (!WP[aar]) WP[aar] = await api('wolfpack', { aar });
    tegnWolfpack(WP[aar]);
  } catch (e) { const el = $('#wolfpack'); if (el) el.innerHTML = `<div class="banner v1">${esc(e.message)}</div>`; }
}
const WP_NIVAA = [[50000, 'Platina', 'platina'], [35000, 'Gold', 'gold'], [25000, 'Black', 'black'], [15000, 'Red', 'red']];
const wpNivaa = km => WP_NIVAA.find(([g]) => km >= g) || null;
const wpNeste = km => [...WP_NIVAA].reverse().find(([g]) => km < g) || null;
const wpMerke = n => n ? `<span class="wpmerke ${n[2]}">${n[1].toUpperCase()}</span>` : '';
function tegnWolfpack(d) {
  const el = $('#wolfpack');
  if (!el) return;
  const liste = d.liste.filter(p => wpAvd === 'Alle' || p.avdeling === wpAvd);
  if (!liste.length) { el.innerHTML = `<p class="tom">${t('wpIngen')}</p>`; return; }
  const maks = liste[0].km;
  const medalje = ['🥇', '🥈', '🥉'];
  el.innerHTML = `<div class="wp">${liste.map((p, i) => `<div class="wprad${i === 0 ? ' forst' : ''}">
      <div class="wpnr">${medalje[i] || i + 1}</div>
      <div class="wpinfo"><div class="linje1"><b>${esc(p.navn)}${wpMerke(wpNivaa(p.beste ?? p.km))}</b><span class="wpkm">${kmNr(p.km)} km</span></div>
        <div class="wpbar"><span style="width:${Math.max(2, Math.round(p.km / maks * 100))}%"></span></div>
        <div class="dempet" style="font-size:12.5px">${esc(p.avdeling)}${p.sykler > 1 ? ' · ' + esc(t('wpSykler', p.sykler)) : ''}${(() => { const b = p.beste ?? p.km, n = wpNeste(b); return n ? ' · ' + esc(t('wp_tilNeste', kmNr(n[0] - b), n[1])) : ''; })()}</div></div></div>`).join('')}</div>`;
}

// ─── Mine ───────────────────────────────────────────────────

    <h3>${t('egenTittel')}</h3>

function startEgen(sykkelId) {
  const s0 = sykkelId ? finnSykkel(sykkelId) : null;
  const eierTlf = s0 ? s0.telefon : meg().telefon;
  const mine = S.d.sykler.filter(s => s.telefon === eierTlf);
  const egne = egenFor(eierTlf);
  const forrige = (s0 && egne.find(e => e.sykkel_id === s0.id)) || egne[0] || {};
  G = { eier: eierTlf, sykkel_id: s0 ? s0.id : (mine.length === 1 ? mine[0].id : ''), km: '', merknad: '', bekreftet: false };
  ['reiseforsikring', 'reiseforsikring_selskap', 'forerkort_klasse', 'forerkort_merknad', 'helsetrygdekort', 'helsetrygdekort_utloper', 'mc_forsikring_selskap']

}

    </div>
    <div class="kort"><h3>${t('sykkel')}</h3>

function sistKmEgen(sykkelId) {
  if (!sykkelId) return '';
  const k = kontrollerFor(sykkelId).find(x => !tom(x.km));
  const e = S.d.egenerklaeringer.find(x => x.sykkel_id === sykkelId && !tom(x.km));
  const v = [k, e].filter(Boolean).sort((a, b) => String(b.dato).localeCompare(String(a.dato)))[0];
  return v ? t('sist', v.km) : '';
}

// ─── Handbook (Road Rules and Hand Signals – English, like the club) ──
const HB = {"title":"Road Rules and Hand Signals","chapters":[{"h":"Introduction","body":[{"p":"Motorcycle club riding is based on discipline, communication, awareness and mutual respect. This guide establishes common procedures for group riding, formations, communication and safety."},{"p":"Everyone who rides with the pack is expected to know the contents of this guide. New members ride their first trips next to an experienced rider, and the Road Captain goes through the most important signals before departure."},{"p":"The rules in this guide never override Norwegian traffic law. The pack obeys traffic lights, speed limits and road markings like any other road user."}]},{"h":"Roles in the Pack","body":[{"h3":"The Road Captain"},{"p":"The Road Captain is responsible for route planning, safety, formations, communication and the overall movement of the group."},{"b":["Plans the route, breaks and fuel stops in advance.","Holds the briefing before departure.","Rides at the front, sets the pace and gives the hand signals.","Chooses the formation according to road, weather and traffic.","Decides when the pack overtakes, changes lanes or stops."]},{"h3":"Assistant Road Captain"},{"p":"Assistant Road Captains support the Road Captain, assist with traffic control, relay signals and help maintain group integrity."},{"b":["Takes over as leader if the Road Captain has to leave the pack.","Makes sure signals are passed through the whole formation.","Keeps an eye on riders who fall behind or have problems."]},{"h3":"Tail Gunner"},{"p":"The Tail Gunner rides last and is the Road Captain's eyes at the back of the pack. The Tail Gunner should be an experienced rider."},{"b":["Watches the whole formation and the traffic behind.","Secures the lane when the pack changes lanes or overtakes (see Claim the Lane).","Stops with any rider who breaks down or has to leave the pack, and informs the Road Captain.","Never overtakes the pack."]},{"h3":"Every Rider"},{"b":["Keeps position and spacing in the formation.","Repeats hand signals to the riders behind.","Rides their own ride – never faster than they are comfortable with. Nobody is left behind for riding safely."]}]},{"h":"Road Hierarchy","body":[{"p":"Road hierarchy provides structure and predictability. Safety always takes priority over tradition."},{"b":["The Road Captain leads at the front, followed by the Assistant Road Captain(s).","Experienced members ride in the front part of the pack.","New members and prospects ride in the middle, next to an experienced rider.","The Tail Gunner rides last.","Riders keep the position they were given at departure. Changing position is done at stops, not on the road."]}]},{"h":"Formations","body":[{"p":"Side-by-side formation is the preferred formation for most riding situations. Staggered and single file are used when conditions require."},{"h3":"Side-by-Side (standard)"},{"p":"Two riders share the lane, each in their own half. The more experienced rider takes the inside (left) position."},{"b":["Keep a comfortable distance to the rider beside you, so both of you can move within your half of the lane.","Keep about two seconds to the pair in front.","Ride side by side with the rider next to you – not slightly ahead or behind.","If one rider has to avoid a hazard, the other gives room."]},{"h3":"Staggered"},{"p":"Riders alternate between the left and right part of the lane, so there is more space in front of every rider."},{"b":["About one second to the rider diagonally in front, two seconds to the rider directly in front.","Used on narrower roads, in poor road conditions and when the Road Captain signals it."]},{"h3":"Single File"},{"p":"All riders in one line in the same track."},{"b":["At least two seconds to the rider in front.","Used on narrow and winding roads, in tight curves, on gravel and poor asphalt, in road works and when visibility is poor."]},{"h3":"When to change formation"},{"p":"The Road Captain changes from side-by-side to staggered or single file when there is not enough room for two riders in the lane:"},{"b":["Tight curves and narrow or winding roads.","Gravel, potholes, wet leaves or other poor road surface.","Rain, darkness, fog or low sun.","Road works, tunnels and narrow bridges.","Heavy traffic and when the pack is being overtaken."]},{"p":"The pack returns to side-by-side when the Road Captain gives the signal."}]},{"h":"Riding Procedures","body":[{"h3":"Before the ride"},{"b":["Arrive with a full tank and a motorcycle that has passed the monthly technical inspection.","The Road Captain holds a short briefing: route, breaks, formation, Tail Gunner and any special hazards.","Everyone confirms that they know the route to the first stop, in case the pack is split."]},{"h3":"Departure"},{"p":"The Road Captain gives the Start Engines signal. The pack leaves the parking area in single file and forms up once on the road."},{"h3":"Intersections and traffic lights"},{"b":["The pack never runs a red light to stay together.","If the pack is split, the front part slows down or stops at a safe place and waits for the rest.","In queues, tighten up in pairs so the pack takes as little space as possible."]},{"h3":"Changing lanes and overtaking on the motorway"},{"p":"On the motorway the pack uses the Claim the Lane signal (see Hand Signal Reference). The Tail Gunner secures the left lane first, and the rest of the pack moves out behind the Tail Gunner's protection. The Tail Gunner only moves out when the lane is clear – other traffic is never forced to brake."},{"h3":"Fuel and breaks"},{"b":["The Road Captain plans fuel stops based on the motorcycle with the shortest range.","Any rider who needs to stop – for fuel, a toilet break or anything else – points at the fuel tank. The signal is relayed to the Road Captain and the pack stops at the next station.","At stops, park together and leave the exit free."]},{"h3":"Breakdown or a rider leaving the pack"},{"b":["A rider with a problem signals, uses the indicator and pulls over where it is safe.","The Tail Gunner stops with the rider. The pack continues to a safe place and waits.","Hazard lights on, everyone off the roadway and behind the guardrail where possible."]},{"h3":"Accident"},{"n":["Secure the scene: hazard lights, warning triangle and high-visibility vest. Stop traffic if necessary.","Call 113 (ambulance) – and 112 (police) / 110 (fire) when needed.","Give first aid. Do not remove the helmet unless it is necessary to keep the airway open.","Inform the Road Captain. The Road Captain decides what the rest of the pack does."]}]},{"h":"Safety","body":[{"p":"Every rider is responsible for safety, preparedness and maintaining a roadworthy motorcycle."},{"b":["The motorcycle passes the club's monthly technical inspection – registered in the RC Portal.","Full protective gear: helmet, jacket, gloves, trousers and boots.","No alcohol or drugs before or during a ride. The legal limit in Norway is 0.2 per mille; the recommended club standard is zero.","Rested and fit to ride. Tell the Road Captain if you need a break.","Carry driving licence, vehicle registration, health insurance card (EHIC) when abroad, and a phone with the Road Captain's number."]}]}],"signalsIntro":"Standardized hand signals ensure clear communication throughout the group. The club keeps hand signals to a minimum, so that every rider knows them all. Signals are given with the left hand – the right hand stays on the throttle. Every signal is repeated by the riders behind until it has reached the Tail Gunner.","groups":[{"h":"Departure and Direction","signals":[{"h":"Start Engines","img":"image2.jpg","purpose":"Signals the group to start their engines and prepare for departure.","how":"Raise your left hand with your index finger pointing upward and make a circular motion above your head.","when":"Used by the Road Captain when the group is ready to depart.","notes":["Wait until every rider has started and is ready before moving off."]},{"h":"Turn Left","img":"image3.jpg","purpose":"Signals to the group that the Road Captain intends to turn left at the next junction, exit, road, or change of direction.","how":"Extend your left arm straight out to the side and point clearly in the direction of the intended turn.","when":"Use well in advance of the turn so riders behind have sufficient time to observe and react to the signal.","notes":["Hold the signal long enough for the entire formation to see it.","Maintain a steady riding line while signaling.","Cancel the signal once the turn has been initiated.","The signal should be repeated by riders behind when appropriate to ensure it is relayed through the group."]},{"h":"Turn Right","img":"image4.jpg","purpose":"Signals to the group that the Road Captain intends to turn right at the next junction, exit or change of direction.","how":"Raise your left arm above your helmet and point clearly to the right.","when":"Use the signal well in advance of the turn to allow riders behind to relay the signal through the formation.","notes":["Right hand remains on the handlebar.","Hold the signal long enough for the entire formation to observe it.","Riders behind should relay the signal when appropriate.","This signal is used by BMC Norway to indicate a right turn."]}]},{"h":"Formation","signals":[{"h":"Claim the Lane","img":"claim-the-lane.jpg","club":true,"purpose":"Tells the Tail Gunner to move into the left lane and secure it, so that the pack can change lanes and overtake safely on the motorway.","how":"The leader raises the left arm with the upper arm straight out from the body at 90 degrees and the forearm pointing straight up, fist clenched with the index finger pointing up.","when":"Used on the motorway when the pack is going to overtake other vehicles.","steps":["The Road Captain gives the signal well in advance. It is relayed back through the pack to the Tail Gunner.","The Tail Gunner checks mirrors and blind spot. When the left lane is clear, the Tail Gunner indicates and moves out into the left lane.","The Tail Gunner holds the lane, so that approaching traffic is held back behind the pack.","The rest of the pack follows into the left lane from the back forwards. The Road Captain moves out last and leads the overtaking.","After the overtaking, the pack returns to the right lane from the front, with good distance to the overtaken vehicles. The Tail Gunner returns last."],"notes":["The club's most important signal on the motorway.","The Tail Gunner only moves out when the lane is clear. Other traffic is never forced to brake or cut off.","Overtake within the speed limit and return to the right lane as soon as it is safe.","Not the same as Single File: here the upper arm points straight out to the side, in an L-shape."]},{"h":"Side-by-Side","img":"side-by-side.jpg","proposed":true,"purpose":"Tells the pack to return to the standard side-by-side formation.","how":"Raise your left arm straight up with your index and middle finger extended.","when":"Used after single file or staggered riding, when the road again has room for two riders in the lane.","notes":["Pairs form up from the front, calmly and without sudden lane changes."]},{"h":"Staggered Formation","img":"staggered.jpg","proposed":true,"purpose":"Tells the pack to change to staggered formation.","how":"Raise your left arm straight up with your index and middle finger extended, and move your hand from side to side.","when":"Used when the lane is too narrow for side-by-side, but single file is not necessary.","notes":["About one second to the rider diagonally in front, two seconds to the rider directly in front."]},{"h":"Single File","img":"single-file.jpg","proposed":true,"purpose":"Tells the pack to form a single line.","how":"Raise your left arm straight up with only your index finger extended.","when":"Used on narrow and winding roads, in tight curves, road works, tunnels and poor road conditions.","notes":["The rider on the left falls in behind the rider on the right, or as the Road Captain has decided at the briefing.","Keep at least two seconds to the rider in front."]},{"h":"Tighten Formation","img":"tighten.jpg","proposed":true,"purpose":"Tells the pack to close up gaps and ride closer together.","how":"Raise your left arm with a clenched fist and move it up and down.","when":"Used when gaps have opened in the formation, before intersections and in slow traffic.","notes":["Close up gradually – never closer than the safe distance for the formation."]}]},{"h":"Speed","signals":[{"h":"Slow Down","img":"image8.jpg","purpose":"Signals the group to reduce speed in a controlled and predictable manner.","how":"Extend your left arm outward with your palm facing downward and move your hand up and down in a slow pumping motion.","when":"Used when approaching traffic, intersections, curves, hazards, road works, reduced visibility, or any situation requiring the group to slow down.","notes":["Reduce speed smoothly and gradually.","Avoid sudden braking whenever possible.","Riders behind should relay the signal through the formation.","Continue signaling until the group has reacted appropriately.","Maintain full control of the motorcycle while signaling."]},{"h":"Stop","img":"image9.jpg","purpose":"Signals the group to come to a controlled stop.","how":"Raise your left arm straight upward with your palm facing forward.","when":"Used when approaching stop signs, traffic lights, road closures, accidents, emergency situations, or any circumstance requiring the group to stop.","notes":["Begin slowing down smoothly after giving the signal.","Riders behind should relay the signal through the formation.","Avoid sudden braking whenever possible.","Maintain lane discipline while stopping.","Be prepared to place both feet on the ground once the motorcycle comes to a complete stop.","Continue signaling until the riders behind have acknowledged the instruction.","When riding with other clubs: the most common international stop signal is the left arm extended downward with the palm facing back."]}]},{"h":"Hazards","signals":[{"h":"Hazard Left","img":"image5.jpg","purpose":"Warns riders of a hazard located on the left side of the roadway.","how":"Extend your left arm downward and point clearly toward the hazard.","when":"Used to indicate potholes, gravel, debris, uneven pavement, standing water, animals, or any other obstacle that may affect riders traveling on the left side of the lane.","notes":["Point directly at the hazard whenever possible.","Hold the signal long enough for riders behind to identify the danger.","Riders behind should relay the signal through the formation.","After passing the hazard, return your hand to the handlebar.","Always maintain control of the motorcycle while signaling."]},{"h":"Hazard Right","imgs":[["image7.jpg","Preferred: pointing with the right foot."],["image6.jpg","Alternative at low speed: pointing with the right hand."]],"purpose":"Warns riders of a hazard located on the right side of the roadway.","how":"Extend your right leg and point your foot toward the hazard. At low speed, the hazard can also be indicated by pointing with your right hand.","when":"Used to indicate potholes, gravel, debris, standing water, uneven pavement, roadkill, or any other obstacle located on the right side of the roadway.","notes":["The right hand controls the throttle – the foot is the first choice at normal speed.","Maintain full control of the motorcycle at all times.","Hold the signal long enough for riders behind to identify the hazard.","Riders behind should relay the signal through the formation when appropriate.","Return your hand or foot to the normal riding position after passing the hazard."]}]},{"h":"Stops","signals":[{"h":"Stop at Next Station","img":"stop-next-station.jpg","club":true,"purpose":"Tells the Road Captain that the pack should stop at the next fuel station – whatever the reason: fuel, toilet, a break or anything else.","how":"Point at your fuel tank with your left hand.","when":"Can be given by any rider. The signal is relayed forward through the pack to the Road Captain, who confirms by repeating it.","notes":["One signal for every kind of stop – the club keeps hand signals to a minimum.","Give the signal in good time, not when the reserve light comes on.","A tired rider is a hazard to the whole pack – ask for a stop early."]}]}],"proposed":"Proposed signal – confirm with the club before printing."};

function visHbKapittel(i) {

// jsPDF's built-in Helvetica only has Latin-1 (æøå are fine); replace anything else
const pdfTxt = s => String(s == null ? '' : s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x20-\x7E\xA0-\xFF]/g, '');

  P.nySide = () => { doc.addPage(); P.bakgrunn(); P.y = P.M; };

  P.kort = (y, h) => { doc.setFillColor(PDFF.kort); doc.setDrawColor(PDFF.linje); doc.setLineWidth(0.3); doc.roundedRect(P.M, y, P.W - 2 * P.M, h, 2.5, 2.5, 'FD'); };
  P.bar = (x, y, w, andel) => { doc.setFillColor(PDFF.bar); doc.roundedRect(x, y, w, 2.6, 1.3, 1.3, 'F'); if (andel > 0) { doc.setFillColor(PDFF.aksent); doc.roundedRect(x, y, Math.max(2.6, w * andel), 2.6, 1.3, 1.3, 'F'); } };

      P.font(8.5, 'normal', PDFF.dempet);
      if (adr) { const tk = pdfTxt(t('klubbhus') + ': ' + adr); doc.text(tk, X, yy + 2.5); P.font(8.5, 'normal', PDFF.aksent); doc.textWithLink(pdfTxt(t('visKart')), X + doc.getTextWidth(tk) + 3, yy + 2.5, { url: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(adr) }); yy += 4.5; }
      if (a.telefon) { P.font(8.5, 'normal', PDFF.dempet); const tk = pdfTxt(t('klubbTlf') + ': '); doc.text(tk, X, yy + 2.5); P.font(8.5, 'normal', PDFF.aksent); doc.textWithLink(pdfTxt(a.telefon), X + doc.getTextWidth(tk), yy + 2.5, { url: telLenke(a.telefon) }); yy += 4.5; }
    }
    return y + HODE(a, forts);
  };
  const tegnRad = (x, y, forst) => {
    if (!forst) { doc.setDrawColor(PDFF.linje); doc.setLineWidth(0.2); doc.line(X, y, BX, y); }
    P.font(10, 'bold'); doc.text(pdfTxt(x.navn), X, y + 4.6, { maxWidth: 120 });
    P.font(8.5, 'normal', PDFF.dempet); doc.text(pdfTxt(x.status), X, y + 8.2);
    if (x.epost) { P.font(8.5, 'normal', PDFF.aksent); doc.textWithLink(pdfTxt(x.epost), X, y + 11.6, { url: 'mailto:' + x.epost }); }
    if (x.telefon.replace(/\D/g, '').length >= 6) { P.font(10, 'normal', PDFF.aksent); const nr = pdfTxt(x.telefon.replace(/^\(\+47\)\s*/, '')); doc.textWithLink(nr, BX - doc.getTextWidth(nr), y + 6, { url: telLenke(x.telefon) }); }
    return y + RAD(x);
  };
  const bunn = P.H - P.M;
  avd.forEach(({ a, p }) => {
    const hoyde = HODE(a, false) + p.reduce((s, x) => s + RAD(x), 0) + 3;
    const ledig = bunn - P.y, helSide = bunn - P.M;
    if (hoyde > ledig && P.y > P.M + 0.1) {
      if (hoyde <= helSide || ledig < HODE(a, false) + 3 * 12.5) P.nySide();
    }
    // draw the chapter, splitting only if it is taller than a page
    let i = 0, forts = false;
    while (i < p.length) {
      let h = HODE(a, forts), j = i;
      while (j < p.length && P.y + h + RAD(p[j]) + 3 <= bunn) { h += RAD(p[j]); j++; }
      if (j === i) { P.nySide(); continue; }
      P.kort(P.y, h + 3);
      let yy = tegnHode(a, P.y, forts);
      for (let k = i; k < j; k++) yy = tegnRad(p[k], yy, k === i);
      P.y += h + 3 + 4; i = j; forts = true;
      if (i < p.length) P.nySide();
    }
  });
  if (!avd.length) { P.font(10, 'normal', PDFF.dempet); doc.text(pdfTxt(t('tlfIngen')), P.W / 2, P.y + 5, { align: 'center' }); P.y += 10; }
  P.font(7.5, 'normal', PDFF.dempet); doc.text(pdfTxt(t('tlfHentet', fmtAktiv(TLF.hentet))), P.M, Math.min(P.y + 2, P.H - 6));
  await leverPdf(doc, pdfFilnavn(['Bandidos MC Norway', t('telefonliste'), TLF_FA.length === 1 ? TLF_FA[0] : '', new Date().toISOString().slice(0, 10)]));
}
